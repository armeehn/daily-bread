<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=Caveat:wght@600;700&amp;family=UnifrakturMaguntia&amp;display=swap" rel="stylesheet"><script src="./image-slot.js"></script><style>body{margin:0;background:#2a2723;font-family:'IBM Plex Mono',ui-monospace,monospace}a{color:#f0477d}a:hover{color:#12b795}</style></helmet>
<div data-screen-label="Interview" style="width:561px;height:794px;background:#f6f1e7;color:#1d1a17;position:relative;display:flex;flex-direction:column;overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,monospace">
  <sc-if value="{{ chromeOn }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:8px;left:12px;font-size:8.5px;letter-spacing:.14em;opacity:.7;z-index:4">{{ headLeft }}</span><span style="position:absolute;top:8px;right:12px;font-size:8.5px;letter-spacing:.14em;opacity:.7;z-index:4">{{ headRight }}</span><span style="position:absolute;bottom:26px;left:12px;font-size:8.5px;letter-spacing:.14em;opacity:.7;z-index:4">DOC NO. {{ docNo }}</span><span style="position:absolute;bottom:26px;right:12px;font-size:8.5px;letter-spacing:.14em;opacity:.7;z-index:4">{{ folio }}</span><sc-if value="{{ footerOn }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:0;right:0;bottom:0;height:20px;background:{{ footerBg }};border-top:2px solid #1d1a17;z-index:3"></div></sc-if></sc-if>
  <sc-if value="{{ isPortrait }}" hint-placeholder-val="{{ false }}">
  <div style="flex:1;padding:30px 26px 56px 26px;display:flex;flex-direction:column;gap:12px;min-height:0">
    <div style="position:relative;flex:1;border:2px solid #1d1a17;min-height:0"><image-slot id="db-{{ slug }}-portrait" shape="rect" placeholder="{{ placeholder }}"></image-slot>
      <div style="position:absolute;left:0;right:0;bottom:0;background:#1d1a17;color:#f6f1e7;font-size:9px;letter-spacing:.13em;padding:4px 8px;pointer-events:none">{{ caption }}</div>
    </div>
    <div style="border-left:6px solid {{ accent }};padding:6px 0 6px 12px;font-size:16px;line-height:1.35;font-weight:600;font-style:italic">{{ quote }}</div>
  </div>
  </sc-if>
  <sc-if value="{{ isQa }}" hint-placeholder-val="{{ true }}">
  <div style="flex:1;padding:30px 26px 56px 26px;display:flex;flex-direction:column;min-height:0">
    <span style="font-size:10px;font-weight:700;letter-spacing:.12em;background:{{ accent }};color:#f6f1e7;padding:3px 10px;align-self:flex-start">{{ kicker }}</span>
    <h1 style="margin:12px 0 0;font-size:27px;line-height:1;font-weight:800;text-transform:uppercase">{{ title }}</h1>
    <div style="font-size:11.5px;line-height:1.62;margin-top:12px;overflow:hidden">
      <sc-for list="{{ qaList }}" as="x" hint-placeholder-count="6">
        <p style="margin:0 0 8px"><b style="color:{{ x.c }}">{{ x.sp }}:</b> {{ x.t }}</p>
      </sc-for>
    </div>
    <div style="margin-top:auto;margin-bottom:12px;font-size:9px;letter-spacing:.1em;opacity:.6;border-top:2px solid #1d1a17;padding-top:6px">{{ footNote }}</div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:561,&quot;height&quot;:794},
&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;qa&quot;,&quot;portrait&quot;],&quot;default&quot;:&quot;qa&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},
&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Q&amp;A / UNCUT&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Q&amp;A&quot;},
&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Forty Years of Nerve&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Q&amp;A&quot;},
&quot;qa&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Q&amp;A&quot;},
&quot;qLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DB&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Q&amp;A&quot;},
&quot;aLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MD&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Q&amp;A&quot;},
&quot;footNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Q&amp;A&quot;},
&quot;quote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Portrait&quot;},
&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Portrait&quot;},
&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Portrait&quot;},
&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#f0477d&quot;,&quot;#fe9a0d&quot;,&quot;#12b795&quot;,&quot;#1d1a17&quot;],&quot;default&quot;:&quot;#f0477d&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;footer&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mono&quot;,&quot;duo&quot;,&quot;accent&quot;,&quot;none&quot;],&quot;default&quot;:&quot;mono&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;chrome&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;headLeft&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;05 · INTERVIEW&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;headRight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;40 YEARS OF OKANAGAN QUEER LIFE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;docNo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DB-016-A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;folio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;slug&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;intv&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
class Component extends DCLogic {
  p(k,d){const v=this.props[k];return v==null||v===''?d:v}
  sp(s){return String(s).split('||').map(t=>t.trim()).filter(Boolean)}
  renderVals(){
    const v=this.p('variant','qa'),f=this.p('footer','mono'),a=this.p('accent','#f0477d');
    const qL=this.p('qLabel','DB'),aL=this.p('aLabel','MD');
    const qa=this.sp(this.p('qa','Q: You started performing here in 1986. What\u2019s actually changed?||A: The audience got younger and the rent got meaner. In \u201986 the danger was people; now the danger is landlords. I know which fight I prefer — you can charm people.||Q: Where did everyone go when the venues closed?||A: Nowhere, sweetheart. That\u2019s the secret. We\u2019re all still here — we just meet in gymnasiums and orchards and each other\u2019s kitchens. A scene isn\u2019t an address.||Q: Advice for the seventeen-year-olds reading this?||A: Learn to sew, learn to drive, and never let a city tell you it doesn\u2019t contain you. It does. It always did.')).map(b=>{
      const isQ=/^q\s*:/i.test(b);return{sp:isQ?qL:aL,c:isQ?a:'#1d1a17',t:b.replace(/^[qa]\s*:\s*/i,'')};});
    return{isPortrait:v==='portrait',isQa:v==='qa',
      chromeOn:this.props.chrome??true,accent:a,
      headLeft:this.p('headLeft','05 · INTERVIEW'),headRight:this.p('headRight','40 YEARS OF OKANAGAN QUEER LIFE'),
      docNo:this.p('docNo','DB-016-A'),folio:this.p('folio',v==='portrait'?'15':'16'),
      footerOn:f!=='none',footerBg:f==='duo'?"repeating-conic-gradient(from 45deg,#f0477d 0% 25%,#12b795 0% 50%) 0 0/20px 20px":f==='accent'?`repeating-conic-gradient(${a} 0% 25%,#f6f1e7 0% 50%) 0 0/16px 16px`:"repeating-conic-gradient(#1d1a17 0% 25%,#f6f1e7 0% 50%) 0 0/16px 16px",
      kicker:this.p('kicker','Q&A / UNCUT'),title:this.p('title','Forty Years of Nerve'),qaList:qa,
      quote:this.p('quote','\u201cWe didn\u2019t have a bar, darling. We had basements, and we had nerve.\u201d'),
      caption:this.p('caption','FIG. 7 — \u201cMISS DEMEANOUR,\u201d PERFORMING SINCE 1986. HAIR BY GRAVITY DEFIANCE.'),
      placeholder:this.p('placeholder','portrait — Miss Demeanour in full regalia, backstage'),
      footNote:this.p('footNote','FULL 90-MINUTE AUDIO IN THE №1 ARCHIVE · CONTINUED NEXT PAGE →'),
      slug:this.p('slug','intv')};
  }
}
</script>
</body>
</html>
