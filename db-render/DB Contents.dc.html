<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=Caveat:wght@600;700&amp;family=UnifrakturMaguntia&amp;display=swap" rel="stylesheet"><script src="./image-slot.js"></script><style>body{margin:0;background:#2a2723;font-family:'IBM Plex Mono',ui-monospace,monospace}a{color:#f0477d}a:hover{color:#12b795}</style></helmet>
<div data-screen-label="Contents" style="width:561px;height:794px;background:#f6f1e7;color:#1d1a17;position:relative;display:flex;flex-direction:column;overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,monospace">
  <sc-if value="{{ chromeOn }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:8px;left:12px;font-size:8.5px;letter-spacing:.14em;opacity:.7;z-index:4">{{ headLeft }}</span><span style="position:absolute;top:8px;right:12px;font-size:8.5px;letter-spacing:.14em;opacity:.7;z-index:4">{{ headRight }}</span><span style="position:absolute;bottom:26px;left:12px;font-size:8.5px;letter-spacing:.14em;opacity:.7;z-index:4">DOC NO. {{ docNo }}</span><span style="position:absolute;bottom:26px;right:12px;font-size:8.5px;letter-spacing:.14em;opacity:.7;z-index:4">{{ folio }}</span><sc-if value="{{ footerOn }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:0;right:0;bottom:0;height:20px;background:{{ footerBg }};border-top:2px solid #1d1a17;z-index:3"></div></sc-if></sc-if>
  <sc-if value="{{ isManifest }}" hint-placeholder-val="{{ true }}">
  <div style="flex:1;padding:30px 26px 56px 26px;display:flex;flex-direction:column;min-height:0">
    <h1 style="margin:0;font-size:32px;font-weight:800;text-transform:uppercase">{{ title }}<span style="color:{{ accent }}">.</span></h1>
    <div style="border:2px solid #1d1a17;margin-top:14px;flex:1;display:flex;flex-direction:column;min-height:0">
      <div style="padding:6px 10px;font-size:9.5px;font-weight:700;letter-spacing:.15em;border-bottom:2px solid #1d1a17;background:#eae4d6;display:flex;justify-content:space-between"><span>{{ manifestLabel }}</span><span style="color:{{ accent }}">{{ manifestTag }}</span></div>
      <div style="padding:8px 10px;font-size:11px;overflow:hidden">
        <sc-for list="{{ tocRows }}" as="row" hint-placeholder-count="14">
          <div style="display:flex;align-items:baseline;gap:8px;padding:4.5px 0;border-bottom:1px dashed #1d1a17"><span style="font-weight:700;color:#f6f1e7;background:{{ row.c }};padding:0 6px;font-size:9.5px;flex:none">{{ row.a }}</span><span style="font-weight:600;min-width:0">{{ row.b }}</span><span style="margin-left:auto;font-size:8.5px;opacity:.55;letter-spacing:.08em;flex:none">{{ row.k }}</span></div>
        </sc-for>
      </div>
    </div>
  </div>
  </sc-if>
  <sc-if value="{{ isContributors }}" hint-placeholder-val="{{ false }}">
  <div style="flex:1;padding:30px 26px 56px 26px;display:flex;flex-direction:column;gap:14px;min-height:0">
    <span style="font-size:10px;font-weight:700;letter-spacing:.12em;background:#12b795;color:#f6f1e7;padding:3px 10px;align-self:flex-start">{{ whoTag }}</span>
    <div style="font-size:12px;line-height:1.6;text-align:justify">{{ whoBlurb }}</div>
    <div style="border:2px solid #1d1a17">
      <div style="padding:6px 10px;font-size:9.5px;font-weight:700;letter-spacing:.15em;border-bottom:2px solid #1d1a17;background:#fe9a0d">{{ subTitle }}</div>
      <div style="padding:10px;font-size:11.5px;line-height:1.6">
        <sc-for list="{{ subRowsList }}" as="s" hint-placeholder-count="4">
          <div style="border-bottom:1px dashed #1d1a17;padding:4px 0">▸ <b>{{ s.a }}</b> — {{ s.b }}</div>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{ hasScrib }}" hint-placeholder-val="{{ true }}"><div style="font-family:'Caveat',cursive;font-size:20px;color:{{ accent }};transform:rotate(-2deg)">{{ scribble }}</div></sc-if>
    <div style="margin-top:auto;margin-bottom:12px;font-size:9px;letter-spacing:.1em;opacity:.6;border-top:2px solid #1d1a17;padding-top:6px">{{ footNote }}</div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:561,&quot;height&quot;:794},
&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;manifest&quot;,&quot;contributors&quot;],&quot;default&quot;:&quot;manifest&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},
&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Contents&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Manifest&quot;},
&quot;manifestLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MANIFEST / №1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Manifest&quot;},
&quot;manifestTag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DB-TOC&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Manifest&quot;},
&quot;rows&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Manifest&quot;},
&quot;whoTag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;WHO’S IN HERE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contributors&quot;},
&quot;whoBlurb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contributors&quot;},
&quot;subTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SUBMIT TO №2 — “THE THAW”&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contributors&quot;},
&quot;subRows&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contributors&quot;},
&quot;scribble&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contributors&quot;},
&quot;footNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contributors&quot;},
&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#f0477d&quot;,&quot;#fe9a0d&quot;,&quot;#12b795&quot;,&quot;#1d1a17&quot;],&quot;default&quot;:&quot;#f0477d&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;footer&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mono&quot;,&quot;duo&quot;,&quot;accent&quot;,&quot;none&quot;],&quot;default&quot;:&quot;duo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;chrome&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;headLeft&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DAILY BREAD №1 · KELOWNA BC&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;headRight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;THEME: KELOWNA’S COLLAPSE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;docNo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DB-002-A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},
&quot;folio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;}}">
class Component extends DCLogic {
  PAL=['#1d1a17','#f0477d','#fe9a0d','#12b795']
  p(k,d){const v=this.props[k];return v==null||v===''?d:v}
  sp(s){return String(s).split('||').map(t=>t.trim()).filter(Boolean)}
  rw(s,n){return this.sp(s).map(r=>{const f=r.split('|').map(x=>x.trim());while(f.length<n)f.push('');return{a:f[0],b:f[1],c:f[2],d:f[3]}})}
  renderVals(){
    const v=this.p('variant','manifest'),f=this.p('footer','duo'),a=this.p('accent','#f0477d');
    const scribble=this.p('scribble','none');
    const toc=this.rw(this.p('rows','01 | Our Daily Dread — editor\u2019s letter | HOUSE||04 | Before the Bridge — a rude history | HISTORY||08 | Vacancy — photo essay, Bernard Ave | PHOTO||11 | Young Voices — three field reports | OPINION||14 | Crumbs — ep.1, a golem seeks housing | COMIC||16 | Forty Years of Nerve — Miss Demeanour | INTERVIEW||19 | Lake Effect / Harvest — poems | LIT||20 | Peel Me — sticker sheet | STICKERS||21 | Colour Your Own Collapse | SATIRE||22 | The Wall — two pieces, centre rip-out | ART||25 | The Waitlist — healthcare feature | ISSUES||28 | The Lake Takes — fiction pt.1 | LIT||30 | From the Lab — funder disclosure | RIPOSTE||32 | Ask a Local Gay / Reviews | SERVICE||34 | The Bite Back / Rotation | FOOD+MUSIC||36 | The Rewind + Movies in the Park | FILM||38 | Calendar / Directory / Go-Bag | AID||41 | Crumbs Mail · finale · guest strip | COMIC||44 | Who Made This — staff, assembled | COLOPHON'),3);
    return{isManifest:v==='manifest',isContributors:v==='contributors',
      chromeOn:this.props.chrome??true,accent:a,
      headLeft:this.p('headLeft','DAILY BREAD №1 · KELOWNA BC'),headRight:this.p('headRight','THEME: KELOWNA\u2019S COLLAPSE'),
      docNo:this.p('docNo','DB-002-A'),folio:this.p('folio',v==='manifest'?'02':'03'),
      footerOn:f!=='none',footerBg:f==='duo'?"repeating-conic-gradient(from 45deg,#f0477d 0% 25%,#12b795 0% 50%) 0 0/20px 20px":f==='accent'?`repeating-conic-gradient(${a} 0% 25%,#f6f1e7 0% 50%) 0 0/16px 16px`:"repeating-conic-gradient(#1d1a17 0% 25%,#f6f1e7 0% 50%) 0 0/16px 16px",
      title:this.p('title','Contents'),manifestLabel:this.p('manifestLabel','MANIFEST / №1'),manifestTag:this.p('manifestTag','DB-TOC'),
      tocRows:toc.map((r,i)=>({...r,k:r.c,c:r.d&&r.d.startsWith('#')?r.d:this.PAL[i%4]})),
      whoTag:this.p('whoTag','WHO\u2019S IN HERE'),
      whoBlurb:this.p('whoBlurb','Twelve contributors made №1: writers aged 17–74, two photographers, one cartoonist, one very patient proofreader. Every byline is local. Every fee got paid before the printer did.'),
      subTitle:this.p('subTitle','SUBMIT TO №2 — \u201cTHE THAW\u201d'),
      subRowsList:this.rw(this.p('subRows','Art for The Wall | one page, yours, 300dpi. We pay.||Opinion (under 25) | 500 words of correct anger.||Poems, fiction, comics | weird welcome.||Deadline | Sept 15 · hello@dailybread.example'),2),
      scribble,hasScrib:scribble!=='none',
      footNote:this.p('footNote','DAILY BREAD IS FREE / PWYC · PRINT RUN 500 · FONTS: IBM PLEX MONO, UNIFRAKTUR')};
  }
}
</script>
</body>
</html>
