}
/* Cancelling puts back the model exactly as it was when the wizard opened.
   Re-tinting from the draft back to the original theme could not: two roles the
   draft had made the same colour both came back as whichever role is first. */
function closeWizard(restore){
  if(!wiz) return;
  if(restore && wiz.orig) restoreModel(wiz.orig);
  if(wiz.back) wiz.back.remove();
  wiz = null;
}
function applyDraftLive(){
  setTheme(wiz.draft);   // live preview only; not saved until "Save preset"
  renderPreview();
}
function buildWizardShell(){
  const stale=document.querySelector(".wiz-back"); if(stale) stale.remove();
  const back=document.createElement("div"); back.className="wiz-back";
  back.addEventListener("mousedown", e=>{ if(e.target===back) closeWizard(true); });
  const card=document.createElement("div"); card.className="wiz";
  card.innerHTML =
    '<div class="wh"><span class="t">Theme</span><span class="sub">accessible<br>colour wizard</span>'+
    '<button class="x" title="Cancel">✕</button></div>'+
    '<div class="dots"></div><div class="wb"></div>'+
    '<div class="wf"><button class="wbtn" data-a="back">Back</button><span class="grow"></span>'+
    '<span class="wnote"></span><button class="wbtn" data-a="next">Next →</button>'+
    '<button class="wbtn teal" data-a="save" style="display:none">Save preset</button></div>';
  back.appendChild(card); document.body.appendChild(back);
  card.querySelector(".x").addEventListener("click",()=>closeWizard(true));
  card.querySelector('[data-a="back"]').addEventListener("click",()=>{ if(wiz.step>0){ wiz.step--; renderWizard(); } });
  card.querySelector('[data-a="next"]').addEventListener("click",()=>{ if(wiz.step<WSTEPS.length-1){ wiz.step++; renderWizard(); } });
  card.querySelector('[data-a="save"]').addEventListener("click", saveWizardTheme);
  wiz.back=back; wiz.dots=card.querySelector(".dots"); wiz.body=card.querySelector(".wb"); wiz.foot=card.querySelector(".wf");
}
function cbadge(ratio){
  const lvl=wcagLevel(ratio), passTarget = ratio>=wiz.target;
  const cls = lvl==="AAA" ? "aaa" : (passTarget ? "pass" : "failb");
  const mark = passTarget ? "✓" : "✗";
  return '<span class="cbadge '+cls+'">'+ratio.toFixed(2)+':1 '+mark+' '+(lvl==="fail"?"AA":lvl)+'</span>';
}
function swatchRow(role){
  const d = wiz.draft;
  // The pair this role is the fixable side of (if any); else a representative
  // pair it participates in, shown for information only (e.g. the background).
  const p = pairForRole(role.k);
  const showPair = p || A11Y_PAIRS.find(x=>x.fg===role.k || x.bg===role.k);
  const row=document.createElement("div"); row.className="swrow";
  row.innerHTML = '<div class="smeta"><div class="l">'+esc(role.label)+'</div><div class="h">'+esc(role.hint)+'</div></div>';
  const col=document.createElement("input"); col.type="color"; col.value = isHex(d[role.k])?toHex(d[role.k]):"#888888";
  const hex=document.createElement("input"); hex.type="text"; hex.className="hex"; hex.value=d[role.k];
  const badgeWrap=document.createElement("span");
  const fix=document.createElement("button"); fix.className="wfix"; fix.textContent="Fix";
  if(!p) fix.style.display="none";   // background isn't "fixed" — you adjust the text/accents on it
  function refresh(){
    badgeWrap.innerHTML = showPair ? cbadge(contrast(d[showPair.fg], d[showPair.bg])) : "";
    if(p) fix.disabled = contrast(d[p.fg], d[p.bg])>=wiz.target;
  }
  function set(v){ d[role.k]=v; if(isHex(v)){ col.value=toHex(v); if(role.k==="ink") d.dark=v; } refresh(); applyDraftLive(); }
  col.addEventListener("input",()=>{ hex.value=col.value; set(col.value); });
  hex.addEventListener("input",()=>{ set(hex.value); });
  fix.addEventListener("click",()=>{ if(!p) return; const nv=nudgeToContrast(d[role.k], d[otherRole(p)], wiz.target); hex.value=nv; set(nv); toast(role.label+" → "+nv); });
  row.appendChild(col); row.appendChild(hex); row.appendChild(badgeWrap); row.appendChild(fix);
  refresh();
  return row;
}
function renderWizard(){
  // dots
  wiz.dots.innerHTML="";
  WSTEPS.forEach((_,i)=>{ const d=document.createElement("div"); d.className="d"+(i===wiz.step?" on":(i<wiz.step?" done":"")); wiz.dots.appendChild(d); });
  const b=wiz.body; b.innerHTML="";
  if(wiz.step===0){
    b.innerHTML='<div class="wstep-t">1 · Base &amp; surfaces</div><div class="wstep-d">The paper, the text, and the quiet surfaces. Each badge is the WCAG contrast for that colour’s main use; hit <b>Fix</b> to snap a failing one to your target.</div>';
    const start=document.createElement("div"); start.className="wstart";
    start.innerHTML='<span>Start from</span>';
    const ssel=document.createElement("select");
    ssel.innerHTML='<option value="">current colours</option>'+Object.keys(DB.THEMES).map(k=>'<option value="'+k+'">'+esc(DB.THEMES[k].name)+'</option>').join("");
    ssel.addEventListener("change",()=>{ if(ssel.value){ const t=DB.clone(DB.THEMES[ssel.value]); Object.keys(t).forEach(k=>{ if(k!=="name") wiz.draft[k]=t[k]; }); applyDraftLive(); renderWizard(); } });
    start.appendChild(ssel); b.appendChild(start);
    BASE_ROLES.forEach(r=>b.appendChild(swatchRow(r)));
  } else if(wiz.step===1){
    b.innerHTML='<div class="wstep-t">2 · Accents</div><div class="wstep-d">The three accents carry links, chips and highlights. On light paper these are the pairs that usually fail — <b>Fix</b> deepens the accent just enough to pass, keeping its hue.</div>';
    ACCENT_ROLES.forEach(r=>b.appendChild(swatchRow(r)));
  } else if(wiz.step===2){
    b.innerHTML='<div class="wstep-t">3 · Contrast report</div><div class="wstep-d">Every text/background pair the magazine renders.</div>';
    const tog=document.createElement("label"); tog.className="wtoggle";
    tog.innerHTML='<input type="checkbox" '+(wiz.target>=7?"checked":"")+'> Target WCAG AAA (7:1) instead of AA (4.5:1)';
    tog.querySelector("input").addEventListener("change",e=>{ wiz.target = e.target.checked?7:4.5; renderWizard(); });
    b.appendChild(tog);
    const tbl=document.createElement("table"); tbl.className="wtable";
    tbl.innerHTML='<thead><tr><th>Used for</th><th>Pair</th><th>Contrast</th></tr></thead>';
    const tb=document.createElement("tbody");
    A11Y_PAIRS.forEach(p=>{
      const ratio=contrast(wiz.draft[p.fg], wiz.draft[p.bg]);
      const tr=document.createElement("tr");
      tr.innerHTML='<td>'+esc(p.label)+'</td>'+
        '<td><span class="wsw" style="background:'+esc(wiz.draft[p.fg])+'"></span><span class="wsw" style="background:'+esc(wiz.draft[p.bg])+'"></span> '+p.fg+'/'+p.bg+'</td>'+
        '<td>'+cbadge(ratio)+'</td>';
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); b.appendChild(tbl);
    const fixAll=document.createElement("button"); fixAll.className="wbtn"; fixAll.style.marginTop="14px";
    fixAll.textContent="Auto-fix all to "+(wiz.target>=7?"AAA":"AA");
    fixAll.addEventListener("click",()=>{
      let n=0;
      A11Y_PAIRS.forEach(p=>{ if(contrast(wiz.draft[p.fg],wiz.draft[p.bg])<wiz.target){ wiz.draft[p.fix]=nudgeToContrast(wiz.draft[p.fix], wiz.draft[otherRole(p)], wiz.target); if(p.fix==="ink") wiz.draft.dark=wiz.draft.ink; n++; } });
      applyDraftLive(); renderWizard(); toast(n?("Fixed "+n+" pair"+(n>1?"s":"")):"Everything already passes");
    });
    b.appendChild(fixAll);
  } else {
    const passN=A11Y_PAIRS.filter(p=>contrast(wiz.draft[p.fg],wiz.draft[p.bg])>=wiz.target).length;
    b.innerHTML='<div class="wstep-t">4 · Name &amp; save</div><div class="wstep-d">Saved to your browser and added to the Theme preset menu; it also stays applied to the live preview.</div>';
    const nm=document.createElement("input"); nm.className="wname"; nm.type="text"; nm.placeholder="e.g. Harbour Dusk"; nm.value=wiz.name||"";
    nm.addEventListener("input",()=>{ wiz.name=nm.value; updateWizFoot(); });
    b.appendChild(nm);
    const sum=document.createElement("div"); sum.className="wsum";
    const allPass = passN===A11Y_PAIRS.length;
    sum.innerHTML = (allPass
      ? '<b style="color:var(--teal)">✓ All '+A11Y_PAIRS.length+' pairs pass WCAG '+(wiz.target>=7?"AAA":"AA")+'.</b>'
      : '<b style="color:var(--pink)">'+passN+' of '+A11Y_PAIRS.length+' pairs pass '+(wiz.target>=7?"AAA":"AA")+'.</b> You can still save, but Step 3 → Auto-fix will make it compliant.');
    b.appendChild(sum);
    setTimeout(()=>nm.focus(),30);
  }
  // footer buttons
  wiz.foot.querySelector('[data-a="back"]').style.visibility = wiz.step===0 ? "hidden" : "visible";
  wiz.foot.querySelector('[data-a="next"]').style.display = wiz.step<WSTEPS.length-1 ? "" : "none";
  wiz.foot.querySelector('[data-a="save"]').style.display = wiz.step===WSTEPS.length-1 ? "" : "none";
  updateWizFoot();
}
function updateWizFoot(){
  if(!wiz) return;
  const save=wiz.foot.querySelector('[data-a="save"]'), note=wiz.foot.querySelector(".wnote");
  if(wiz.step===WSTEPS.length-1){ save.disabled = !String(wiz.name||"").trim(); note.textContent = save.disabled ? "Name it to save" : ""; }
  else note.textContent="";

function saveWizardTheme(){
  const name=String(wiz.name||"").trim(); if(!name) return;
  let id=slugify(name), i=2; while(customThemes[id]) id=slugify(name)+"-"+(i++);
  const th={ name }; ["ink","bone","panel","paper2","dark","muted","pink","teal","orange"].forEach(k=>{ th[k]=wiz.draft[k]; });

/* ---------- Arrange mode: free-drag [data-mv] elements with alignment + snapping ----------
   Elements tagged `data-mv` in DB.render become draggable inside the preview. We move
   them with the CSS `translate` property (layout-neutral — no reflow, and it stacks on top
   of any `transform:rotate` the element already has). Dragging snaps the element's edges and
   centres to those of the other movable elements and to the text-column centre; guide lines
   show the match. The offset {dx,dy} is written back to model.positions[key], so it bakes
   into the published index.html via DB.render. Double-click an element to send it home. */
const SNAP = 6;               // snap distance, px
let arrangeOn = false;
function mvPos(key){ model.positions = model.positions || {}; return model.positions[key] || {dx:0,dy:0}; }
function setMvPos(key,dx,dy){
  model.positions = model.positions || {};
  dx = Math.round(dx); dy = Math.round(dy);
  if(!dx && !dy) delete model.positions[key]; else model.positions[key] = {dx,dy};
}
function persistPositions(){ record(); save(); setStatus("Saved ✓", false); }

const MV_STYLE = `
  [data-mv]{cursor:move; outline:1.5px dashed rgba(240,71,125,.85); outline-offset:3px}
  [data-mv]:hover{outline-color:#12b795; outline-style:solid}
  [data-mv].mv-drag{outline-color:#12b795; outline-style:solid}
  body.mv-arrange a:not([data-mv]){pointer-events:none}
  .mv-guide{position:fixed; background:#f0477d; z-index:2147483646; pointer-events:none}
  .mv-guide.v{width:1px; top:0; bottom:0} .mv-guide.h{height:1px; left:0; right:0}
  .mv-badge{position:fixed; z-index:2147483647; pointer-events:none; background:#1d1a17; color:#f6f1e7;
    font:600 10px/1.35 'IBM Plex Mono',ui-monospace,monospace; letter-spacing:.04em; padding:2px 6px; white-space:nowrap}`;

function ifDoc(){ try{ return $("#preview").contentDocument; }catch(e){ return null; } }

function enterArrange(){
  const doc = ifDoc(); if(!doc || !doc.body) return;
  exitArrange(doc);                                   // idempotent re-attach after reloads
  const st = doc.createElement("style"); st.id = "mv-style"; st.textContent = MV_STYLE;
  doc.head.appendChild(st);
  doc.body.classList.add("mv-arrange");
  wireArrange(doc);
}
function exitArrange(docArg){
  const doc = docArg || ifDoc(); if(!doc) return;
  const st = doc.getElementById("mv-style"); if(st) st.remove();
  doc.body && doc.body.classList.remove("mv-arrange");
  clearGuides(doc);
  if(doc.__mvWired){ doc.removeEventListener("pointerdown", doc.__mvDown, true);
    doc.removeEventListener("pointermove", doc.__mvMove, true);
    doc.removeEventListener("pointerup", doc.__mvUp, true);
    doc.removeEventListener("dblclick", doc.__mvDbl, true); doc.__mvWired = false; }
}
function clearGuides(doc){ doc && doc.querySelectorAll(".mv-guide,.mv-badge").forEach(n=>n.remove()); }

function wireArrange(doc){
  if(doc.__mvWired) return;
  let drag = null;

  doc.__mvDown = e=>{
    const el = e.target.closest && e.target.closest("[data-mv]");
    if(!el || !arrangeOn) return;
    e.preventDefault();
    const key = el.getAttribute("data-mv"), base = mvPos(key);
    // Static snap lines from every OTHER movable element (edges + centres),
    // plus the centre X of the element's text column (.wrap).
    const vlines = [], hlines = [];
    doc.querySelectorAll("[data-mv]").forEach(o=>{
      if(o===el) return; const r = o.getBoundingClientRect();
      vlines.push(r.left, r.left + r.width/2, r.right);
      hlines.push(r.top, r.top + r.height/2, r.bottom);
    });
    const wrap = el.closest(".wrap"); if(wrap){ const wr = wrap.getBoundingClientRect(); vlines.push(wr.left + wr.width/2); }
    drag = { el, key, base, sx:e.clientX, sy:e.clientY, vlines, hlines, cur:base };
    el.classList.add("mv-drag");
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
  };
  doc.__mvMove = e=>{
    if(!drag) return;
    let dx = drag.base.dx + (e.clientX - drag.sx), dy = drag.base.dy + (e.clientY - drag.sy);
    drag.el.style.translate = dx+"px "+dy+"px";
    const r = drag.el.getBoundingClientRect();
    const cx = [r.left, r.left + r.width/2, r.right], cy = [r.top, r.top + r.height/2, r.bottom];
    let bv=null; drag.vlines.forEach(x=> cx.forEach(c=>{ const d=x-c; if(Math.abs(d)<=SNAP && (!bv||Math.abs(d)<Math.abs(bv.d))) bv={d,x}; }));
    let bh=null; drag.hlines.forEach(y=> cy.forEach(c=>{ const d=y-c; if(Math.abs(d)<=SNAP && (!bh||Math.abs(d)<Math.abs(bh.d))) bh={d,y}; }));
    if(bv) dx += bv.d; if(bh) dy += bh.d;
    if(bv||bh) drag.el.style.translate = dx+"px "+dy+"px";
    drag.cur = {dx,dy};
    drawGuides(doc, bv, bh, drag.el.getBoundingClientRect(), dx, dy);
  };
  doc.__mvUp = ()=>{
    if(!drag) return;
    drag.el.classList.remove("mv-drag"); clearGuides(doc);
    setMvPos(drag.key, drag.cur.dx, drag.cur.dy); persistPositions();
    drag = null;
  };
  doc.__mvDbl = e=>{
    const el = e.target.closest && e.target.closest("[data-mv]");
    if(!el || !arrangeOn) return;
    e.preventDefault();
    el.style.translate = ""; setMvPos(el.getAttribute("data-mv"), 0, 0); persistPositions();
  };
  doc.addEventListener("pointerdown", doc.__mvDown, true);
  doc.addEventListener("pointermove", doc.__mvMove, true);
  doc.addEventListener("pointerup", doc.__mvUp, true);
  doc.addEventListener("dblclick", doc.__mvDbl, true);
  doc.__mvWired = true;
}

function drawGuides(doc, bv, bh, rect, dx, dy){
  clearGuides(doc);
  if(bv){ const g=doc.createElement("div"); g.className="mv-guide v"; g.style.left=bv.x+"px"; doc.body.appendChild(g); }
  if(bh){ const g=doc.createElement("div"); g.className="mv-guide h"; g.style.top=bh.y+"px"; doc.body.appendChild(g); }
  const b=doc.createElement("div"); b.className="mv-badge";
  b.textContent = "Δ "+Math.round(dx)+", "+Math.round(dy);
  let bx = rect.left, by = rect.top - 22; if(by < 2) by = rect.bottom + 6;
  b.style.left = Math.max(2, bx)+"px"; b.style.top = by+"px";
  doc.body.appendChild(b);
}

/* ============================================================================
   Design mode — edit the magazine by clicking and dragging the page itself
   ----------------------------------------------------------------------------
   db.js emits no editing hooks, and we do not want any in the published file, so
   the studio works out which DOM node came from which model path on its own. It
   renders a *probe* copy of the model with an invisible token appended to every
   prose value:

       letter.headline "Dear reader"  ->  "Dear reader⁣ 7 ⁣"

   The probe is parsed but never displayed. Each token names the element it landed
   in; that element's child-index path is then replayed against the live preview.
   Same model, same render code, so the two trees have the same shape — and we
   check tag names as we go and drop a node rather than guess when they disagree.

       model ──DB.render──> preview  (what you see)
         │
         └──tokens──DB.render──> probe (parsed, thrown away) ──> path ↔ node map

   From that map: click selects a field, double-click edits it in place, a row
   drags to a new position, and an image file dropped on a picture replaces it.
   ========================================================================== */
const TOK = "⁣";                        /* invisible separator: survives esc() and rich() */
const TOK_RE = /⁣(\d+)⁣/g;
/* Values that are geometry, markup or a URL rather than prose. A token in one of
   these would be read as CSS or a font name, and none of them is a thing you click. */
const NOT_PROSE = /(^print\.|^fonts\.|^theme\.|^meta\.maxw$|href$|Src$|Alt$)/;
const CLIMB_MAX = 7;                         /* how far an item block may grow past its fields */
const DRAG_SLOP = 5;                         /* px of travel before a press becomes a drag */

/* every schema field, keyed by path with list indices folded to "#" */
const FIELDS = {};
DB.SCHEMA.forEach(sec=>{
  (sec.fields||[]).forEach(f=>{ FIELDS[f.path] = {label:f.label, type:f.type, opts:f.opts, hint:f.hint, sec}; });
  (sec.lists||[]).forEach(l=>{
    if(l.strings) FIELDS[l.path+".#"] = {label:l.label.replace(/s$/,""), type:l.area?"area":"text", sec, list:l};
    else (l.fields||[]).forEach(sf=>{
      FIELDS[l.path+".#."+sf.path] = {label:sf.label, type:sf.type, opts:sf.opts, sec, list:l, sub:sf};
    });
  });
});
const LISTS = {};
DB.SCHEMA.forEach(sec => (sec.lists||[]).forEach(l=>{ LISTS[l.path] = { list:l, sec }; }));
function tplPath(p){ return p.replace(/\.\d+(?=\.|$)/g, ".#"); }
function fieldInfo(p){ return FIELDS[tplPath(p)]; }

/* Which fields keep <b>, <i> and <a>? db.js decides per field (rich() or esc()),
   and a list here would drift from it. So ask the renderer, the same way the
   design map does: append "<b>token</b>" to every prose field of the default
   model, render once, and a field is rich if a real <b> element came out
   holding its token. Escaped fields show the tag as text; CSS never parses it. */
const RICH = (function(){
  const out = new Set();
  try{
    const probe = DB.clone(DB.DEFAULT_MODEL), tpls = [];
    Object.keys(FIELDS).forEach(tp=>{
      const info = FIELDS[tp];
      if((info.type!=="text" && info.type!=="area") || NOT_PROSE.test(tp)) return;
      const cut = tp.indexOf("#"), p = tp.replace(/#/g, "0");   // row 0 stands in for its list
      if(cut >= 0 && getPath(probe, tp.slice(0, cut) + "0") == null) return;
      const v = getPath(probe, p);
      setPath(probe, p, (v == null ? "" : v) + "<b>" + TOK + tpls.length + TOK + "</b>");
      tpls.push(tp);
    });
    const pdoc = new DOMParser().parseFromString(DB.render(probe), "text/html");
    pdoc.querySelectorAll("body b").forEach(b=>{
      let m; TOK_RE.lastIndex = 0;
      while((m = TOK_RE.exec(b.textContent))) out.add(tpls[+m[1]]);
    });
  }catch(e){ console.warn("rich-field probe failed; no formatting strip", e); }
  return out;
})();
function isRich(p){ return RICH.has(tplPath(p)); }
/* "letter.masthead.2.role" — or the bare row "letter.masthead.2" — -> its list */
function itemOf(p){
  const m = String(p).match(/^(.+?)\.(\d+)(?:\.|$)/);
  if(!m) return null;
  const L = LISTS[tplPath(m[1])];
  if(!L) return null;
  return { list: L.list, listPath: m[1], idx: +m[2], sec: L.sec };
}

let MAP = null;          /* { entries:[{el,paths}], items:[{key,path,idx,el}] } */
let sel = null;          /* selection survives re-renders as a path, not a node */
let designOn = true;
let inlineEl = null;     /* element currently being typed into on the page */
let inspStale = false;   /* rebuild the panel after the next render (row order changed) */
let fieldsDirty = false; /* the accordion is rebuilt lazily when you switch to it */

/* ---------- probe render → path ↔ node map ---------- */

/* every prose value worth tagging: non-empty text/area fields, list rows included */
function proseTargets(){
  const out = [];
  const push = p => {
    const info = fieldInfo(p);
    if(!info || (info.type!=="text" && info.type!=="area")) return;
    if(NOT_PROSE.test(p)) return;
    const v = getPath(model, p);
    if(typeof v==="string" && v.trim()) out.push(p);
  };
  DB.SCHEMA.forEach(sec=>{
    (sec.fields||[]).forEach(f=> push(f.path));
    (sec.lists||[]).forEach(l=>{
      (getPath(model, l.path)||[]).forEach((it,i)=>{
        if(l.strings) push(l.path+"."+i);
        else (l.fields||[]).forEach(sf=> push(l.path+"."+i+"."+sf.path));
      });
    });
  });
  return out;
}

/* address an element by its child index at every level, from <html> down */
function idxPath(el){
  const out = [];
  while(el && el.parentElement){
    out.unshift(Array.prototype.indexOf.call(el.parentElement.children, el));
    el = el.parentElement;
  }
  return out;
}
function resolveIdx(doc, ip){
  let el = doc.documentElement;
  for(let i=0;i<ip.length;i++){ if(!el || !el.children[ip[i]]) return null; el = el.children[ip[i]]; }
  return el;
}

function buildMap(){
  MAP = null;
  const doc = ifDoc(); if(!doc || !doc.body) return;
  const paths = proseTargets(); if(!paths.length) return;

  const probe = DB.clone(model);
  paths.forEach((p,i)=> setPath(probe, p, getPath(probe,p) + TOK + i + TOK));
  let pdoc;
  try{ pdoc = new DOMParser().parseFromString(DB.render(probe), "text/html"); }
  catch(e){ console.warn("design map: probe render failed", e); return; }

  const found = new Map();                       // probe element -> [path index…]
  const w = pdoc.createTreeWalker(pdoc.documentElement, NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode(); n; n=w.nextNode()){
    if(n.nodeValue.indexOf(TOK) < 0) continue;
    const pel = n.parentElement;
    if(!pel || !pdoc.body.contains(pel)) continue;   // <title> and friends are not clickable
    let m; TOK_RE.lastIndex = 0;
    while((m = TOK_RE.exec(n.nodeValue))){
      const a = found.get(pel) || []; a.push(+m[1]); found.set(pel, a);
    }
  }

  const entries = [];
  found.forEach((ids, pel)=>{
    const el = resolveIdx(doc, idxPath(pel));
    if(!el || el.tagName !== pel.tagName) return;   // the trees disagree here — leave it alone
    el.setAttribute("data-dbp", entries.length);
    entries.push({ el, paths: ids.map(i=>paths[i]) });
  });
  if(!entries.length) return;

  MAP = { entries, items: markItems(doc, entries) };
  markImages(doc);
  applySelection(doc);
}

/* A row's block on the page: start at the fields of row i and climb while the
   parent would not swallow a field belonging to some other row or section. */
function markItems(doc, entries){
  const byItem = new Map();
  entries.forEach(en => en.paths.forEach(p=>{
    const it = itemOf(p); if(!it) return;
    const key = it.listPath+"#"+it.idx, a = byItem.get(key) || [];
    if(a.indexOf(en.el) < 0) a.push(en.el);
    byItem.set(key, a);
  }));
  const all = entries.map(e=>e.el), items = [];
  byItem.forEach((els, key)=>{
    const mine = new Set(els), outside = all.filter(e=>!mine.has(e));
    let a = els[0];
    while(a && !els.every(e=>a.contains(e))) a = a.parentElement;   // common ancestor
    if(!a) return;
    for(let n=0; n<CLIMB_MAX; n++){
      const up = a.parentElement;
      if(!up || up === doc.body || outside.some(o=>up.contains(o))) break;
      a = up;
    }
    if(a === doc.body || a === doc.documentElement) return;
    a.setAttribute("data-dbi", key);
    items.push({ key, path:key.split("#")[0], idx:+key.split("#")[1], el:a });
  });
  return items;
}

/* image fields, matched by the src they rendered as — a dropped file replaces one */
function markImages(doc){
  const imgs = Array.from(doc.querySelectorAll("img"));
  const mark = (path)=>{
    const v = getPath(model, path); if(!v) return;
    // two rows may carry the same picture: each takes the next one on the page
    const im = imgs.find(n=> !n.hasAttribute("data-dbimg") && n.getAttribute("src") === v);
    if(im) im.setAttribute("data-dbimg", path);
  };
  DB.SCHEMA.forEach(sec=>{
    (sec.fields||[]).forEach(f=>{ if(f.type === "image") mark(f.path); });
    (sec.lists||[]).forEach(l=> (l.fields||[]).forEach(sf=>{
      if(sf.type !== "image") return;
      (getPath(model, l.path)||[]).forEach((_, i)=> mark(l.path+"."+i+"."+sf.path));
    }));
  });
}

/* ---------- what the preview looks like while you are editing it ---------- */
const DZ_STYLE = `
  body.dz-on [data-dbp]{cursor:text}
  body.dz-on [data-dbp]:hover{outline:1.5px dashed rgba(240,71,125,.8); outline-offset:2px}
  body.dz-on [data-dbi]:hover{outline:1.5px dashed rgba(18,183,149,.85); outline-offset:5px}
  body.dz-on [data-dbimg]{cursor:copy}
  body.dz-on .dz-sel{outline:2.5px solid #f0477d !important; outline-offset:3px}
  body.dz-on .dz-hot{outline:3px dashed #12b795 !important; outline-offset:5px}
  body.dz-on .dz-lift{opacity:.35}
  body.dz-on .dz-edit{outline:2.5px solid #12b795 !important; outline-offset:3px}
  .dz-line{position:fixed; background:#12b795; z-index:2147483646; pointer-events:none}
  .dz-line.h{height:3px} .dz-line.v{width:3px}`;

function enterDesign(){
  const doc = ifDoc(); if(!doc || !doc.body) return;
  if(!doc.getElementById("dz-style")){
    const st = doc.createElement("style"); st.id="dz-style"; st.textContent=DZ_STYLE;
    doc.head.appendChild(st);
  }
  doc.body.classList.add("dz-on");
  wireDesign(doc);
}
function exitDesign(){
  const doc = ifDoc(); if(!doc) return;
  const st = doc.getElementById("dz-style"); if(st) st.remove();
  doc.body && doc.body.classList.remove("dz-on");
  clearDropLine(doc);
}

function hasFiles(e){
  return !!(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types||[], "Files") >= 0);
}
function live(){ return designOn && !arrangeOn; }

function wireDesign(doc){
  if(doc.__dzWired) return;
  let press = null, drag = null;

  doc.__dzDown = e=>{
    if(!live() || inlineEl || e.button !== 0) return;
    const item = e.target.closest && e.target.closest("[data-dbi]");
    press = { x:e.clientX, y:e.clientY, item };
  };
  doc.__dzMove = e=>{
    if(!press) return;
    if(!drag){
      // a still pointer is a click; only past a few pixels does it become a drag
      if(!press.item || Math.abs(e.clientX-press.x) + Math.abs(e.clientY-press.y) < DRAG_SLOP) return;
      drag = startRowDrag(doc, press.item);
      if(!drag){ press = null; return; }
    }
    e.preventDefault();
    moveRowDrag(doc, drag, e);
  };
  doc.__dzUp = ()=>{
    if(drag){ dropRowDrag(doc, drag); drag = null; }
    press = null;
  };
  doc.__dzClick = e=>{
    if(!live() || !e.target.closest) return;
    if(inlineEl && e.target.closest(".dz-edit")) return;
    const t = e.target.closest("[data-dbp]") || e.target.closest("[data-dbi]");
    if(t || e.target.closest("a")){ e.preventDefault(); e.stopPropagation(); }
    if(inlineEl) endInline(true);
    pick(t);
  };
  doc.__dzDbl = e=>{
    if(!live()) return;
    const el = e.target.closest && e.target.closest("[data-dbp]");
    if(!el) return;
    e.preventDefault();
    beginInline(el);
  };
  doc.__dzOver = e=>{
    if(!live() || !hasFiles(e)) return;
    e.preventDefault();
    const im = e.target.closest && e.target.closest("[data-dbimg]");
    e.dataTransfer.dropEffect = im ? "copy" : "none";
    doc.querySelectorAll(".dz-hot").forEach(n=>n.classList.remove("dz-hot"));
    if(im) im.classList.add("dz-hot");
  };
  doc.__dzDrop = e=>{
    if(!live() || !hasFiles(e)) return;
    e.preventDefault();
    doc.querySelectorAll(".dz-hot").forEach(n=>n.classList.remove("dz-hot"));
    const im = e.target.closest && e.target.closest("[data-dbimg]");
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(!im || !f || !/^image\//.test(f.type)){ toast("Drop an image file onto a picture"); return; }
    readImageInto(f, im.getAttribute("data-dbimg"));
  };

  doc.addEventListener("pointerdown", doc.__dzDown, true);
  doc.addEventListener("pointermove", doc.__dzMove, true);
  doc.addEventListener("pointerup",   doc.__dzUp,   true);
  doc.addEventListener("click",       doc.__dzClick, true);
  doc.addEventListener("dblclick",    doc.__dzDbl,  true);
  doc.addEventListener("dragover",    doc.__dzOver, true);
  doc.addEventListener("drop",        doc.__dzDrop, true);
  doc.__dzWired = true;
}

function readImageInto(file, path){
  takeImage(file, path, src=>{ setPath(model, path, src); touched("panel"); toast("Image replaced", UNDO); });
}

/* ---------- drag a row to a new position ---------- */
function rowIdx(el){ return +el.getAttribute("data-dbi").split("#")[1]; }

function startRowDrag(doc, el){
  const path = el.getAttribute("data-dbi").split("#")[0];
  const sibs = Array.prototype.filter.call(el.parentElement.children, n=>{
    const k = n.getAttribute && n.getAttribute("data-dbi");
    return k && k.split("#")[0] === path;
  });
  if(sibs.length < 2) return null;

  // rows laid out side by side (badges, sticker sheet) drop on the X axis instead
  const a = sibs[0].getBoundingClientRect(), b = sibs[1].getBoundingClientRect();
  const horiz = Math.abs(b.left - a.left) > Math.abs(b.top - a.top);
  el.classList.add("dz-lift");
  return { el, path, from:rowIdx(el), sibs, horiz, to:null };
}
function moveRowDrag(doc, d, e){
  const p = d.horiz ? e.clientX : e.clientY;
  let to = d.sibs.length;
  for(let i=0;i<d.sibs.length;i++){
    const r = d.sibs[i].getBoundingClientRect();
    if(p < (d.horiz ? r.left + r.width/2 : r.top + r.height/2)){ to = i; break; }
  }
  d.to = to;
  drawDropLine(doc, d, to);
}
function dropRowDrag(doc, d){
  d.el.classList.remove("dz-lift"); clearDropLine(doc);
  if(d.to == null) return;
  const last = d.sibs[d.sibs.length-1];
  const to = d.to >= d.sibs.length ? rowIdx(last) + 1 : rowIdx(d.sibs[d.to]);
  const arr = getPath(model, d.path);
  if(!arr || to === d.from || to === d.from + 1) return;
  const [row] = arr.splice(d.from, 1);
  arr.splice(to > d.from ? to - 1 : to, 0, row);
  sel = null;
  touched("panel"); toast("Moved");
}
function clearDropLine(doc){ doc && doc.querySelectorAll(".dz-line").forEach(n=>n.remove()); }
function drawDropLine(doc, d, to){
  clearDropLine(doc);
  const at = to >= d.sibs.length ? d.sibs[d.sibs.length-1] : d.sibs[to];
  const r = at.getBoundingClientRect(), end = to >= d.sibs.length;
  const g = doc.createElement("div");
  g.className = "dz-line " + (d.horiz ? "v" : "h");
  if(d.horiz){
    g.style.left = ((end ? r.right : r.left) - 1) + "px";
    g.style.top = r.top + "px"; g.style.height = r.height + "px";
  } else {
    g.style.top = ((end ? r.bottom : r.top) - 1) + "px";
    g.style.left = r.left + "px"; g.style.width = r.width + "px";
  }
  doc.body.appendChild(g);
}

/* ---------- type straight onto the page ---------- */
function beginInline(el){
  const en = entryFor(el); if(!en || en.paths.length !== 1) { pick(el); return; }
  const path = en.paths[0], v = getPath(model, path);
  // Only plain text can round-trip through the page: anything the renderer
  // rewrote (markup, a newline that became <br>) is edited in the panel instead.
  if(typeof v !== "string" || el.textContent.trim() !== v.trim()){
    pick(el); toast("This one has formatting — edit it in the panel");
    return;
  }
  pick(el);
  inlineEl = el;
  el.contentEditable = "true";
  el.classList.add("dz-edit");
  el.__dzPath = path;
  el.focus();
  const doc = ifDoc(), r = doc.createRange();
  r.selectNodeContents(el); doc.defaultView.getSelection().removeAllRanges();
  doc.defaultView.getSelection().addRange(r);
  el.__dzBlur = ()=> endInline(true);
  el.__dzKey = e=>{
    if(e.key === "Escape"){ e.preventDefault(); endInline(false); }
    else if(e.key === "Enter" && fieldInfo(path).type !== "area"){ e.preventDefault(); endInline(true); }
  };
  el.addEventListener("blur", el.__dzBlur);
  el.addEventListener("keydown", el.__dzKey);
  setStatus("Editing…", true);
}
function endInline(commit){
  const el = inlineEl; if(!el) return;
  inlineEl = null;
  el.removeEventListener("blur", el.__dzBlur);
  el.removeEventListener("keydown", el.__dzKey);
  el.contentEditable = "false";
  el.classList.remove("dz-edit");
  const path = el.__dzPath, was = getPath(model, path);
  if(!commit){ el.textContent = was; setStatus("Saved ✓", false); return; }
  const now = el.textContent.replace(/\s+$/,"");
  if(now === was){ setStatus("Saved ✓", false); return; }
  setPath(model, path, now);
  touched("panel");
}

/* ---------- selection + the inspector ---------- */
function entryFor(el){ return MAP && MAP.entries.find(en=> en.el === el); }
// where a model path shows on the page: its own element, else its row's block
function elForPath(p){
  if(!MAP) return null;
  const en = MAP.entries.find(e=> e.paths.indexOf(p) >= 0);
  if(en) return en.el;
  const it = itemOf(p);
  const row = it && MAP.items.find(x=> x.key === it.listPath+"#"+it.idx);
  return row ? row.el : null;
}
function selEl(){ return sel ? elForPath(sel.paths[0]) : null; }
function applySelection(doc){
  if(!doc || !doc.body) return;
  doc.querySelectorAll(".dz-sel").forEach(n=>n.classList.remove("dz-sel"));
  const el = selEl(); if(el) el.classList.add("dz-sel");
}
function pick(el){
  const en = el && entryFor(el);
  if(en) sel = { paths: en.paths.slice() };
  else if(el && el.getAttribute && el.getAttribute("data-dbi")){
    const it = MAP && MAP.items.find(x=>x.el === el);
    sel = it ? { paths:[it.path+"."+it.idx] } : null;
  } else sel = null;
  applySelection(ifDoc());
  renderInspector();
}

/* the model changed from the page side: re-render, re-map, mark the accordion stale */
function touched(stale){
  fieldsDirty = true;
  if(stale === "panel") inspStale = true;
  schedule();
}

function renderInspector(){
  const pane = $("#designPane"); pane.innerHTML = "";
  if(!sel){ pane.appendChild(blankPanel()); return; }

  const box = document.createElement("div"); box.className = "insp";
  const first = sel.paths[0], it = itemOf(first);
  const info = fieldInfo(first) || (it ? {label:it.list.label, type:"text", sec:it.sec}
                                       : {label:first, type:"text"});
  const sec = (it && it.sec) || info.sec;

  const crumb = document.createElement("div"); crumb.className = "crumb";
  crumb.textContent = sec ? sectionLabel(sec) : "Model";
  const what = document.createElement("div"); what.className = "what";
  what.textContent = it ? (it.list.label + " · row " + (it.idx+1)) : info.label;
  box.appendChild(crumb); box.appendChild(what);

  if(it) box.appendChild(rowActions(it));

  // A row shows every field it has — including the colours and links the page

/* ---------- All fields ↔ the page ----------

const LOCATE_STYLE = `

/* ---------- drag a row in the sidebar list ---------- */

function clearDropMarks(wrap){
  wrap.querySelectorAll(".dropbefore,.dropafter").forEach(n=>n.classList.remove("dropbefore","dropafter"));
}
function wireRowDrag(item, hd, l, i, wrap){
  const grip = hd.querySelector(".grip");
  grip.addEventListener("dragstart", e=>{
    rowDragFrom = { path:l.path, i };
    item.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", String(i)); }catch(_){}
  });
  grip.addEventListener("dragend", ()=>{
    item.classList.remove("dragging"); clearDropMarks(wrap); rowDragFrom = null;
  });
  const side = e => {
    const r = item.getBoundingClientRect();
    return (e.clientY - r.top) > r.height/2 ? "after" : "before";
  };
  item.addEventListener("dragover", e=>{
    if(!rowDragFrom || rowDragFrom.path !== l.path) return;
    e.preventDefault();
    clearDropMarks(wrap);
    item.classList.add("drop" + side(e));
  });
  item.addEventListener("drop", e=>{
    if(!rowDragFrom || rowDragFrom.path !== l.path) return;
    e.preventDefault();
    const from = rowDragFrom.i, to = i + (side(e) === "after" ? 1 : 0);
    rowDragFrom = null;
    clearDropMarks(wrap);
    if(to === from || to === from + 1){ redrawList(wrap, l); return; }
    const a = getPath(model, l.path);
    a.splice(to > from ? to - 1 : to, 0, a.splice(from, 1)[0]);
    redrawList(wrap, l); schedule();
  });
}

/* ============================================================================
   Image editor — a picture is looked at, and fixed, before it goes in
   ----------------------------------------------------------------------------
   Every file picked or dropped opens here; so does Edit… on a placed picture.
   Crop (free or to a ratio), turn, flip, and brightness / contrast / saturation
   / black and white. Nothing reaches the model until "Use this image".

   openImageEditor(src, {png, edge}) resolves to a data: URL, to IE_UNCHANGED
   (nothing was touched: the caller embeds the original the usual way, so an
   untouched upload is byte-for-byte what it was before the editor existed), or
   to null (cancelled). The preview shows the adjustments with a CSS filter; the
   output applies them on a canvas, with ctx.filter where the browser has it and
   by hand on the pixels where it does not.

const IE_UNCHANGED = {};
const IE_RATIOS = [["Free",0],["Original",-1],["1:1",1],["4:5",4/5],["3:2",3/2],["16:9",16/9]];
const IE_SLIDERS = [["b","Brightness",50,150],["c","Contrast",50,150],["s","Saturation",0,200],["g","Black & white",0,100]];
const IE_FILTER_OK = (function(){ try{ const c=document.createElement("canvas").getContext("2d"); return !!c && typeof c.filter==="string"; }catch(e){ return false; } })();
let ie = null;

function ieFilter(st){ return "brightness("+st.b+"%) contrast("+st.c+"%) saturate("+st.s+"%) grayscale("+st.g+"%)"; }
function ieFresh(){ return { rot:0, fx:false, fy:false, b:100, c:100, s:100, g:0, ratio:0, crop:{x:0,y:0,w:1,h:1} }; }
function ieTouched(st){
  const c=st.crop;
  return st.rot || st.fx || st.fy || st.b!==100 || st.c!==100 || st.s!==100 || st.g ||
    c.x>0.001 || c.y>0.001 || c.w<0.999 || c.h<0.999;
}
// the picture as turned and flipped: its width and height
function ieDims(st, img){ const t = st.rot % 180 !== 0; return { w: t ? img.naturalHeight : img.naturalWidth, h: t ? img.naturalWidth : img.naturalHeight }; }
// draw the turned, flipped picture at scale k onto ctx (sized to it already)
function ieDrawOriented(ctx, st, img, k){
  const o = ieDims(st, img);
  ctx.save();
  ctx.translate(o.w*k/2, o.h*k/2);
  ctx.rotate(st.rot*Math.PI/180);
  ctx.scale(st.fx ? -1 : 1, st.fy ? -1 : 1);
  ctx.drawImage(img, -img.naturalWidth*k/2, -img.naturalHeight*k/2, img.naturalWidth*k, img.naturalHeight*k);
  ctx.restore();
}
// what ctx.filter would have done, for browsers without it (same order as CSS)
function ieFilterPixels(ctx, w, h, st){
  const d = ctx.getImageData(0, 0, w, h), p = d.data;
  const B = st.b/100, C = st.c/100, S = st.s/100, G = st.g/100;
  for(let i=0;i<p.length;i+=4){
    let r=p[i]*B, g=p[i+1]*B, b=p[i+2]*B;
    r=(r-127.5)*C+127.5; g=(g-127.5)*C+127.5; b=(b-127.5)*C+127.5;
    let l=.2126*r+.7152*g+.0722*b;
    r=l+(r-l)*S; g=l+(g-l)*S; b=l+(b-l)*S;
    l=.2126*r+.7152*g+.0722*b;
    p[i]=r+(l-r)*G; p[i+1]=g+(l-g)*G; p[i+2]=b+(l-b)*G;
  }

function ieOutputSize(st, img, edge){
  const o = ieDims(st, img), c = st.crop;
  const w = Math.max(1, Math.round(c.w*o.w)), h = Math.max(1, Math.round(c.h*o.h));
  const k = Math.min(1, edge/Math.max(w, h));

function ieRender(st, img, opts){
  const o = ieDims(st, img);

  ieDrawOriented(full.getContext("2d"), st, img, 1);
  const sz = ieOutputSize(st, img, opts.edge);
  const out = document.createElement("canvas"); out.width = sz.w; out.height = sz.h;
  const ctx = out.getContext("2d");

function openImageEditor(src, opts){
  opts = opts || {};
  opts.edge = opts.edge || EMBED_MAX_EDGE_PX;
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      if(!img.naturalWidth || !img.naturalHeight){ resolve(IE_UNCHANGED); return; }   // an SVG with no size: nothing to crop

    };

  });

function ieOpen(img, opts, resolve){

      '<button class="x" title="Cancel (Esc)">✕</button></div>'+
      '<div class="ie-body">'+
        '<div class="ie-stage"><div class="ie-wrap"><canvas></canvas>'+
          '<div class="ie-crop"><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i></div></div></div>'+
        '<div class="ie-side">'+
          '<div><h5>Crop</h5><div class="ie-btns ie-ratios"></div></div>'+
          '<div><h5>Turn &amp; flip</h5><div class="ie-btns">'+
            '<button data-a="rl" title="Turn left">⟲ 90°</button><button data-a="rr" title="Turn right">⟳ 90°</button>'+
            '<button data-a="fx">Flip ↔</button><button data-a="fy">Flip ↕</button></div></div>'+

      '</div>'+

        '<button class="wbtn teal" data-a="ok">Use this image</button></div>'+
    '</div>';

function ieClose(result){

}
function ieAccept(){

// the preview: the turned picture fitted to the stage; adjustments as a CSS filter
function ieDraw(){
  const { st, img, cv } = ie;
  const o = ieDims(st, img), stage = ie.back.querySelector(".ie-stage");
  const maxW = Math.max(200, stage.clientWidth - 24), maxH = Math.min(520, Math.max(260, window.innerHeight*0.62));
  const k = Math.min(maxW/o.w, maxH/o.h, 1);
  cv.width = Math.max(1, Math.round(o.w*k)); cv.height = Math.max(1, Math.round(o.h*k));
  ieDrawOriented(cv.getContext("2d"), st, img, k);
}
function ieSync(){
  const { st, img, cv, crop, back } = ie;
  cv.style.filter = ieFilter(st);
  const c = st.crop;
  crop.style.left = (c.x*cv.width)+"px"; crop.style.top = (c.y*cv.height)+"px";
  crop.style.width = (c.w*cv.width)+"px"; crop.style.height = (c.h*cv.height)+"px";
  back.querySelectorAll(".ie-ratios button").forEach(b=> b.classList.toggle("on", +b.dataset.r === st.ratio));
  back.querySelector('[data-a="fx"]').classList.toggle("on", st.fx);
  back.querySelector('[data-a="fy"]').classList.toggle("on", st.fy);
  back.querySelectorAll(".ie-sl input").forEach(inp=>{
    inp.value = st[inp.dataset.k];

// ratio as width/height of the turned picture, in the crop's 0..1 units
function ieRatioN(){
  const { st, img } = ie; if(!st.ratio) return 0;
  const o = ieDims(st, img), R = st.ratio === -1 ? o.w / o.h : st.ratio;

}
// the biggest crop of the chosen ratio, centred on the current one
function ieFitRatio(){
  const Rn = ieRatioN(), c = ie.st.crop; if(!Rn) return;
  let w = 1, h = w / Rn;
  if(h > 1){ h = 1; w = Rn; }
  const cx = c.x + c.w/2, cy = c.y + c.h/2;
  ie.st.crop = { w, h, x: Math.min(1-w, Math.max(0, cx - w/2)), y: Math.min(1-h, Math.max(0, cy - h/2)) };

function ieFlipCrop(a){
  const c = ie.st.crop;

}
function ieWireCrop(stage){
  let drag = null;
  const pt = e=>{ const r = ie.cv.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top)/r.height)) }; };

  });

    if(!drag) return;
    const p = pt(e), c = ie.st.crop;
    if(drag.mode === "move"){
      c.x = Math.min(1 - c.w, Math.max(0, p.x - drag.ox));
      c.y = Math.min(1 - c.h, Math.max(0, p.y - drag.oy));
    } else {
      const Rn = ieRatioN();
      let w = Math.abs(p.x - drag.ax), h = Math.abs(p.y - drag.ay);
      const sx = p.x < drag.ax ? -1 : 1, sy = p.y < drag.ay ? -1 : 1;
      if(Rn){
        const roomW = sx < 0 ? drag.ax : 1 - drag.ax, roomH = sy < 0 ? drag.ay : 1 - drag.ay;
        if(w / Rn > h) h = w / Rn; else w = h * Rn;
        if(w > roomW){ w = roomW; h = w / Rn; }
        if(h > roomH){ h = roomH; w = h * Rn; }
      }
      w = Math.max(0.02, w); h = Math.max(0.02, h);
      ie.st.crop = { w, h, x: sx < 0 ? drag.ax - w : drag.ax, y: sy < 0 ? drag.ay - h : drag.ay };
      const n = ie.st.crop;
      n.x = Math.min(1 - n.w, Math.max(0, n.x)); n.y = Math.min(1 - n.h, Math.max(0, n.y));
    }
    ieSync();
  });
  const end = ()=>{ drag = null; };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
}

/* ============================================================================
   Find — one box for every field, every line of copy, and every command
   ----------------------------------------------------------------------------
   The schema has a few hundred fields across nineteen sections, and the page
   only offers a handle on the ones that print as text. Find searches field
   labels, section names and what each field currently says, so "deadline",
   "Bernard Ave" or "pink" all land somewhere. Picking a field selects it on the
   page when it is there, or opens it in All fields when it is not (colours,
   print settings, links), and puts the cursor in it.
   ========================================================================== */
const PLAIN = s => String(s==null?"":s).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
const FOLD = s => PLAIN(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shortLabel = l => l.label.replace(/\s*\(.*$/,"");
let palItems = [], palRes = [], palAct = 0, palPrev = null;

function palCommands(){
  const c = (label, run, keys, words)=> ({ kind:"cmd", label, run, keys:keys||"", hay:FOLD(label+" "+(words||"")) });
  const out = [
    c("Publish → index.html", ()=> $("#publishBtn").click(), "", "download html web deploy commit"),
    c("Export JSON — back up this edition", ()=> $("#exportBtn").click(), "", "save download backup file"),
    c("Undo", undo, MODK+" Z", "back revert"),
    c("Redo", redo, MODK+" ⇧ Z", "again"),
    c("Magazine PDF — typeset the press booklet", ()=> $("#magPdfBtn").click(), "", "print pdf press booklet tex latex"),
    c("Web PDF — print what is on screen", ()=> $("#pdfBtn").click(), "", "print pdf"),
    c("Import JSON as a new edition…", ()=> $("#importBtn").click(), "", "open load file"),
    c("New edition…", ()=> $("#edNewBtn").click(), "", "issue add create"),
    c("Keyboard shortcuts", showKeys, "?", "help keys hotkeys"),
    c("Duplicate this edition…", ()=> $("#edDupBtn").click(), "", "copy clone issue"),
    c("Rename this edition…", ()=> $("#edRenBtn").click(), "", "issue name title"),
    c("Create an accessible theme…", openThemeWizard, "", "colour color palette contrast wcag wizard"),
    c("Preview at full width", ()=> setWidth("full"), "", "desktop wide"),
    c("Preview at tablet width", ()=> setWidth("tab"), "", "ipad"),
    c("Preview at phone width", ()=> setWidth("phone"), "", "mobile narrow"),
    c(arrangeOn ? "Leave Arrange" : "Arrange — drag things into place", ()=> $("#arrangeBtn").click(), "", "move position layout nudge"),
    c(designOn ? "Show all fields" : "Show the design inspector", ()=> showMode(designOn ? "fields" : "design"), "", "mode panel accordion"),
    c("Open the preview in a new tab", ()=> $("#openTab").click(), "", "window"),
    c("Reset this edition to the default…", ()=> $("#resetBtn").click(), "", "clear start over"),
  ];
  shelf.order.forEach(id=>{
    if(id !== shelf.current) out.push(c("Open edition: "+shelf.items[id].name, ()=> switchEdition(id), "", "switch issue"));
  });
  Object.keys(DB.THEMES).forEach(k=>
    out.push(c("Theme: "+DB.THEMES[k].name, ()=> applyTheme(DB.THEMES[k]), "", "preset colour color palette")));
  Object.keys(customThemes).forEach(k=>
    out.push(c("Theme: "+(customThemes[k].name||k), ()=> applyTheme(customThemes[k]), "", "preset colour color palette mine")));
  return out;
}
function palFields(){
  const out = [];
  const add = (label, sub, v, path, type)=> out.push({ kind:"field", label, sub, path,
    value: type==="image" ? (/^data:/.test(v||"") ? "(embedded image)" : PLAIN(v)) : PLAIN(v) });
  DB.SCHEMA.forEach(sec=>{
    const sl = sectionLabel(sec);
    out.push({ kind:"sec", label:sl, sub:(sec.tag||"").replace("//","").trim(),
               hay:FOLD(sl+" "+sec.title+" "+sec.id), run:()=> goSection(sec) });
    (sec.fields||[]).forEach(f=> add(f.label, sl, getPath(model, f.path), f.path, f.type));
    (sec.lists||[]).forEach(l=>{
      (getPath(model, l.path)||[]).forEach((row, i)=>{
        if(l.strings) add(shortLabel(l)+" · "+(i+1), sl, row, l.path+"."+i);
        else (l.fields||[]).forEach(sf=>
          add(sf.label, sl+" · "+shortLabel(l)+" "+(i+1), row && row[sf.path], l.path+"."+i+"."+sf.path, sf.type));
      });
    });
  });
  out.forEach(o=>{ if(o.kind==="field"){ o.hay = FOLD(o.label+" "+o.sub); o.vhay = FOLD(o.value); } });
  return out;
}

function openPalette(q){
  if(wiz || ie || $("#keysBack")) return;
  if(inlineEl) endInline(true);
  openMenu(null); flush();
  palPrev = document.activeElement;
  palItems = palCommands().concat(palFields());
  $("#palBack").hidden = false;
  const inp = $("#palIn"); inp.value = q || "";
  palFilter(); inp.focus(); inp.select();
}
function closePalette(restore){
  if($("#palBack").hidden) return;
  $("#palBack").hidden = true;
  if(restore && palPrev && palPrev.focus && document.contains(palPrev)) palPrev.focus({ preventScroll:true });
  palPrev = null;
}
function palFilter(){
  const q = FOLD($("#palIn").value), toks = q ? q.split(" ") : [];
  const groups = [ { t:"Commands", max:8, a:[] }, { t:"Sections", max:8, a:[] },
                   { t:"Fields", max:30, a:[] }, { t:"In the copy", max:40, a:[] } ];
  if(!toks.length){
    groups[0].a = palItems.filter(o=> o.kind==="cmd").slice(0, 9).map(o=> ({ o, s:0 }));
    groups[1].max = 30;
    groups[1].a = palItems.filter(o=> o.kind==="sec").map(o=> ({ o, s:0 }));
  } else palItems.forEach(o=>{
    const inHay = toks.every(t=> o.hay.indexOf(t) >= 0);
    if(!inHay && !(o.vhay && toks.every(t=> (o.hay+" "+o.vhay).indexOf(t) >= 0))) return;
    // a name that matches beats copy that matches; both at once beats either
    const s = (o.hay.startsWith(q) ? 3 : inHay ? 2 : 0) + (o.vhay && o.vhay.indexOf(q) >= 0 ? 1 : 0);
    const g = o.kind==="cmd" ? 0 : o.kind==="sec" ? 1 : inHay ? 2 : 3;
    groups[g].a.push({ o, s, hit: !inHay });
  });
  palRes = []; palAct = 0;
  const list = $("#palList"); list.innerHTML = "";
  // the group holding the best match leads, so ↵ on "bleed" is the Bleed field,
  // not the section that happens to be called "Print & bleed"
  groups.forEach(g=>{ g.a.sort((x, y)=> y.s - x.s); g.best = g.a.length ? g.a[0].s : -1; });
  groups.slice().sort((x, y)=> y.best - x.best).forEach(g=>{
    if(!g.a.length) return;
    const hd = document.createElement("div"); hd.className = "grp"; hd.textContent = g.t;
    list.appendChild(hd);
    g.a.slice(0, g.max).forEach(r=>{
      const i = palRes.length, o = r.o;
      palRes.push(o);
      const row = document.createElement("div");
      row.className = "opt"; row.id = "po-"+i; row.setAttribute("role", "option");
      const sub = o.kind==="field"
        ? esc(o.sub) + (o.value ? " — " + mark(snippet(o.value, r.hit ? toks : []), toks) : "")
        : esc(o.sub || "");
      row.innerHTML = '<span class="k">'+(o.kind==="cmd" ? "›" : o.kind==="sec" ? "§" : "¶")+'</span>'+
        '<span class="m"><div class="l">'+mark(o.label, toks)+'</div>'+(sub ? '<div class="s">'+sub+'</div>' : "")+'</span>'+
        (o.keys ? '<span class="r">'+esc(o.keys)+'</span>' : "");
      row.addEventListener("mousemove", ()=>{ if(palAct !== i) palSet(i); });
      row.addEventListener("click", ()=> palRun(i));
      list.appendChild(row);
    });
  });
  if(!palRes.length){
    const n = document.createElement("div"); n.className = "none";
    n.textContent = "Nothing matches “"+$("#palIn").value+"”. Find looks through field names, section names and the copy itself.";
    list.appendChild(n);
  }
  palSet(0);
}
// the part of a long value around the first hit, not its first sixty characters
function snippet(v, toks){
  const low = v.toLowerCase();
  let at = -1;
  toks.forEach(t=>{ const i = low.indexOf(t); if(i >= 0 && (at < 0 || i < at)) at = i; });
  if(at < 0) return v.length > 90 ? v.slice(0, 90) + "…" : v;
  const s = Math.max(0, at - 30), e = Math.min(v.length, at + 70);
  return (s ? "…" : "") + v.slice(s, e) + (e < v.length ? "…" : "");
}
// escape, and mark each search word where it appears
function mark(text, toks){
  text = String(text == null ? "" : text);
  if(!toks.length) return esc(text);
  const re = new RegExp("(" + toks.map(t=> t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "ig");
  return text.split(re).map((p, i)=> i % 2 ? "<mark>"+esc(p)+"</mark>" : esc(p)).join("");
}
function palSet(i){
  if(!palRes.length) return;
  palAct = (i + palRes.length) % palRes.length;
  document.querySelectorAll("#palList .opt.on").forEach(n=> n.classList.remove("on"));
  const row = $("#po-"+palAct);
  if(row){ row.classList.add("on"); row.scrollIntoView({ block:"nearest" }); }
  $("#palIn").setAttribute("aria-activedescendant", "po-"+palAct);
}
function palRun(i){
  const o = palRes[i]; if(!o) return;
  closePalette(false);
  if(o.kind==="field") goField(o.path); else o.run();
}
$("#palIn").addEventListener("input", palFilter);
$("#palIn").addEventListener("keydown", e=>{
  e.stopPropagation();
  if(e.key==="ArrowDown"){ e.preventDefault(); palSet(palAct+1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); palSet(palAct-1); }
  else if(e.key==="Enter"){ e.preventDefault(); palRun(palAct); }
  else if(e.key==="Escape" || ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k")){ e.preventDefault(); closePalette(true); }
});
$("#palBack").addEventListener("mousedown", e=>{ if(e.target === $("#palBack")) closePalette(true); });
$("#findBtn").addEventListener("click", ()=> openPalette());

/* a field from Find: on the page if it prints there, otherwise in All fields */
function goField(path){
  if(arrangeOn) $("#arrangeBtn").click();          // Arrange hides the map; step out of it
  const el = designOn && elForPath(path);
  if(el && el.isConnected){
    const en = MAP.entries.find(e=> e.el === el && e.paths.indexOf(path) >= 0);
    sel = { paths: en ? en.paths.slice() : [path] };
    applySelection(ifDoc()); renderInspector();
    el.scrollIntoView({ block:"center" });
    const inp = $("#designPane").querySelector('[data-path="'+CSS.escape(path)+'"]');
    if(inp){ inp.focus({ preventScroll:true }); if(inp.select) inp.select(); flashEl(inp.closest(".field")); }
    return;
  }
  revealField(path);
}
function goSection(sec){
  const el = sectionEl(sec);
  if(designOn && el && el.isConnected){ el.scrollIntoView({ block:"start" }); return; }
  revealInFields(sec);
  if(el && el.isConnected) el.scrollIntoView({ block:"start" });
}
function setWidth(w){ const b = document.querySelector('.pvbar button[data-w="'+w+'"]'); if(b) b.click(); }

/* ---------- keyboard ---------- */
function showKeys(){
  if($("#keysBack")) return;
  closePalette(false);
  const k = s => s.split(" ").map(x=> "<kbd>"+esc(x)+"</kbd>").join(" ");
  const rows = [
    ["Anywhere", [
      [k(MODK+" K"), "Find a field, a line of copy, or a command"],
      [k(MODK+" Z"), "Undo"],
      [k(MODK+" ⇧ Z")+" "+k(MODK+" Y"), "Redo"],
      [k(MODK+" S"), "Save now — though the studio already saves as you type"],
      [k("?"), "This sheet"],
      [k("Esc"), "Close a menu or dialog; clear the selection"]]],
    ["With a row selected on the page", [
      [k("Alt ↑")+" "+k("Alt ↓"), "Move it up or down"],
      [k(MODK+" D"), "Duplicate it"],
      [k("Delete")+" "+k(MODK+" ⌫"), "Delete it — Undo brings it back"]]],
    ["In a field that takes formatting", [
      [k(MODK+" B")+" "+k(MODK+" I"), "Bold, italic — or use the B / I / Link strip above the field"]]],
    ["On the page", [
      ["Click", "Open it in the panel"],
      ["Double-click", "Type straight onto the page"],
      ["Drag a row", "Reorder it"],
      ["Drop an image", "Replace the picture"]]]
  ];
  const back = document.createElement("div"); back.className = "wiz-back show"; back.id = "keysBack";
  back.innerHTML = '<div class="wiz keys" role="dialog" aria-label="Keyboard shortcuts">'+
    '<div class="wh"><span class="t">Keys</span><span class="sub">keyboard<br>shortcuts</span>'+
    '<button class="x" title="Close">✕</button></div><div class="wb">'+
    rows.map(g=> '<h4>'+esc(g[0])+'</h4><table><tbody>'+
      g[1].map(r=> '<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>').join("")+'</tbody></table>').join("")+
    '</div></div>';
  const close = ()=>{ back.remove(); document.removeEventListener("keydown", esc_, true); };
  const esc_ = e=>{ if(e.key==="Escape" || e.key==="?"){ e.preventDefault(); e.stopPropagation(); close(); } };
  back.addEventListener("mousedown", e=>{ if(e.target === back) close(); });
  back.querySelector(".x").addEventListener("click", close);
  document.addEventListener("keydown", esc_, true);
  document.body.appendChild(back);
}

function isTyping(t){
  if(!t || !t.tagName) return false;
  if(t.isContentEditable) return true;
  const n = t.tagName;
  return n==="TEXTAREA" || n==="SELECT" ||
    (n==="INPUT" && !/^(button|checkbox|radio|color|file|range|submit|reset)$/.test(t.type));
}
/* One handler for the studio and for the preview (focus is often inside the
   page after a click there). Typing on the page keeps the browser's own keys. */
function onKey(e){
  if(e.defaultPrevented || inlineEl || wiz || ie || $("#keysBack") || !$("#palBack").hidden) return;
  const mod = e.ctrlKey || e.metaKey, k = (e.key||"").toLowerCase();
  if(mod && !e.altKey){
    if(k==="k"){ e.preventDefault(); openPalette(); return; }
    if(k==="z"){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
    if(k==="y"){ e.preventDefault(); redo(); return; }
    if(k==="s"){
      e.preventDefault(); flush();
      if(save()){ setStatus("Saved ✓", false); toast("Saved in this browser. The studio saves as you type; ⋯ → Export JSON keeps a copy on disk."); }
      return;
    }
  }
  if(isTyping(e.target)) return;
  if(e.key==="?"){ e.preventDefault(); showKeys(); return; }
  if(e.key==="Escape"){
    if(sel){ sel = null; applySelection(ifDoc()); if(designOn) renderInspector(); }
    return;
  }
  const it = designOn && !arrangeOn && sel && itemOf(sel.paths[0]);
  if(!it) return;
  if(e.altKey && !mod && (e.key==="ArrowUp" || e.key==="ArrowDown")){ e.preventDefault(); moveRow(it, e.key==="ArrowUp" ? -1 : 1); }
  else if(mod && !e.altKey && k==="d"){ e.preventDefault(); duplicateRow(it); }
  else if(!e.altKey && ((!mod && e.key==="Delete") || (mod && e.key==="Backspace"))){ e.preventDefault(); deleteRow(it); }
}
document.addEventListener("keydown", onKey);
function wireKeys(doc){
  if(doc.__keysWired) return;
  doc.addEventListener("keydown", onKey);
  doc.__keysWired = true;
}

/* ---------- boot ---------- */
document.querySelectorAll(".modk").forEach(n=> n.textContent = MODK+" K");
swap("edit");     // narrow screens show one pane at a time; the tabs said Edit but both were showing
hist();
populateEditionSelect();
buildEditor();
renderInspector();
renderPreview();
updateHistButtons();
setStatus(hadSaved?"Restored ✓":"Loaded default", false);
scheduleWordLimits();
</script>
