# Renders the print-ready magazine PDF from source, proves the render is
# deterministic, and publishes it as a build artifact.
#
# The output db-render/out/"Daily Bread №1 — print.pdf" is generated from
# db-render/"Daily Bread Issue 01-print.html" by render-print-pdf.js — NOT an
# uploaded file.
#
# WHY THIS NO LONGER AUTO-COMMITS
# The committed PDF may have been proofed with a printer. CI must not silently
# replace a proofed artifact — especially not on assertions this weak: the old
# "24 pages / A4 landscape" checks both pass on a document whose every page has
# reflowed, so a green run was never evidence that the layout was unchanged.
# Every run still renders, still checks, and uploads the PDF for download; the
# commit happens only when a human asks for it via workflow_dispatch with
# commit=true.
#
# Determinism: fonts come from db-render/vendor (VENDOR_FONTS=1) so an upstream
# font revision or a network hiccup cannot move the layout, and
# SOURCE_DATE_EPOCH is pinned to the commit date so the PDF's own timestamps
# don't churn. Both together make the render byte-reproducible, which the
# "render twice" step below enforces on every run.
#
# Gitea Actions also reads .github/workflows, so this file works on either.
name: render-print-pdf

on:
  push:
    branches: [main]
    paths:
      - 'db-render/Daily Bread Issue 01-print.html'
      - 'db-render/doc-page.js'
      - 'db-render/image-slot.js'
      - 'db-render/logo*.svg'
      - 'db-render/uploads/**'
      - 'db-render/vendor/**'
      - 'db-render/render-print-pdf.js'
      - '.github/workflows/render-print-pdf.yml'
  pull_request:
    paths:
      - 'db-render/Daily Bread Issue 01-print.html'
      - 'db-render/doc-page.js'
      - 'db-render/image-slot.js'
      - 'db-render/logo*.svg'
      - 'db-render/uploads/**'
      - 'db-render/vendor/**'
      - 'db-render/render-print-pdf.js'
      - '.github/workflows/render-print-pdf.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the re-rendered PDF over the committed one (the committed file may be printer-proofed — only do this deliberately)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render-print-pdf-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC: Daily Bread Issue 01-print.html
  PDF: out/Daily Bread №1 — print.pdf

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        working-directory: db-render
        run: |
          npm install playwright@1.61.0 --no-save
          npx playwright install --with-deps chromium

      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Pinning the PDF's own dates to the commit date is what lets the
      # render-twice check below compare whole files instead of page counts.
      - name: Pin SOURCE_DATE_EPOCH to the commit date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Render A4-landscape magazine PDF from source
        working-directory: db-render
        env:
          VENDOR_FONTS: '1'
        run: node render-print-pdf.js "$SRC" "$PDF"

      - name: Sanity-check the output (24 pages, A4 landscape)
        working-directory: db-render
        run: |
          info=$(pdfinfo "$PDF")
          echo "$info"
          echo "$info" | grep -q "Pages: *24" || { echo "::error::expected 24 pages"; exit 1; }
          # A4 landscape ~ 841.9 x 595.3 pt (width > height)
          echo "$info" | grep -Eq "Page size: *84[12](\.[0-9]+)? x 59[456](\.[0-9]+)? pts" || { echo "::error::not A4 landscape"; exit 1; }

      # A claim of determinism that wasn't tested twice is not evidence.
      - name: Render a second time and require byte-identical output
        working-directory: db-render
        env:
          VENDOR_FONTS: '1'
        run: |
          node render-print-pdf.js "$SRC" "out/second.pdf"
          if cmp -s "$PDF" "out/second.pdf"; then
            echo "deterministic: two renders are byte-identical ($(sha256sum "$PDF" | cut -c1-16))"
          else
            echo "::error::render is NOT deterministic — two runs of the same source differ"
            cmp -l "$PDF" "out/second.pdf" | head -20
            ls -l "$PDF" "out/second.pdf"
            exit 1
          fi
          rm -f "out/second.pdf"

      # The committed PDF is the thing a printer may have proofed. Report how
      # the fresh render compares; do not act on it.
      - name: Compare against the committed PDF
        working-directory: db-render
        run: |
          committed=$(git show "HEAD:db-render/$PDF" > /tmp/committed.pdf 2>/dev/null && echo yes || echo no)
          {
            echo "### Rendered print PDF"
            echo
            echo '```'
            pdfinfo "$PDF" | grep -E "Pages|Page size|File size"
            echo "sha256 $(sha256sum "$PDF" | cut -d' ' -f1)"
            echo '```'
            if [ "$committed" = yes ]; then
              echo
              echo "### Committed PDF (unchanged by this run)"
              echo
              echo '```'
              pdfinfo /tmp/committed.pdf | grep -E "Pages|Page size|File size"
              echo "sha256 $(sha256sum /tmp/committed.pdf | cut -d' ' -f1)"
              echo '```'
              echo
              if cmp -s "$PDF" /tmp/committed.pdf; then
                echo "The fresh render matches the committed file byte-for-byte."
              else
                echo "The fresh render **differs** from the committed file. Download the \`print-pdf\` artifact and compare it by eye before deciding to replace a proofed artifact."
              fi
            else
              echo
              echo "No PDF is committed at that path."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rendered PDF
        uses: actions/upload-artifact@v4
        with:
          name: print-pdf
          path: db-render/out/Daily Bread №1 — print.pdf
          if-no-files-found: error
          retention-days: 30

      # Opt-in only. Never runs on push or pull_request.
      - name: Commit the rendered PDF (explicit opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.commit
        run: |
          git config user.name "db-render-bot"
          git config user.email "db-render-bot@users.noreply.github.com"
          git add -f "db-render/$PDF"
          if git diff --cached --quiet; then
            echo "no change in the rendered PDF"
            exit 0
          fi
          git commit -m "ci: re-render print magazine PDF from source (manual opt-in) [skip ci]"
          git push

      - name: Note that nothing was committed
        if: "!(github.event_name == 'workflow_dispatch' && inputs.commit)"
        run: |
          echo "The committed PDF was left untouched. It is downloadable as the \`print-pdf\` artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "To replace the committed file, run this workflow from the Actions tab with **commit = true**." >> "$GITHUB_STEP_SUMMARY"
