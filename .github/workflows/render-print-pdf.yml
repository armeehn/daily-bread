# Renders the print magazine PDF *from the document the web studio shows*, proves the
# render is reproducible, and publishes it as a build artifact.
#
# WHAT CHANGED, AND WHY
# This used to render db-render/"Daily Bread Issue 01-print.html" — a hand-built
# <doc-page> kit with no connection to the studio's model. The studio's own button
# admitted it: "This is the fixed magazine, independent of the model above." So
# editing the magazine in the studio could not change the PDF, and the PDF was not
# evidence of what the studio would show. It now renders DB.render(model) via
# db-render/render-studio-pdf.js — byte-for-byte the HTML the studio drops into its
# preview iframe — so the studio view and the printer's file are one document.
#
# The pagination, trim, bleed, safe area and crop marks all come from db.js's print
# stylesheet, driven by the model's "Print & bleed" panel. Change the trim in the
# studio and this PDF follows; nothing here hardcodes a paper size.
#
# WHICH MODEL
# db-render/render-studio-pdf.js resolves, in order: --model, $MAGAZINE_MODEL,
# <repo>/magazine.model.json, then DB.DEFAULT_MODEL. Committing the studio's
# "Export JSON" output as magazine.model.json is what makes an edit reach this file;
# with no such file the default model is used, which is what a fresh studio shows.
#
# WHY THIS DOES NOT AUTO-COMMIT
# CI must not silently replace the tracked artifact. Every run renders, checks and
# uploads; the commit happens only when a human asks via workflow_dispatch with
# commit=true.
#
# WHAT THE TRACKED ARTIFACT IS ALLOWED TO BE (changed deliberately, see #43)
# This file used to say the committed PDF "may have been proofed with a printer",
# and treated any divergence from a fresh render as information for a human rather
# than an error. That is what let the tracked PDF sit at the pre-rebuild 33-sheet
# layout while the generator produced 19, shipping a PDF that failed this repo's own
# safe-area guard on 18 sheets. The rule is now the other way round: the PDF is a
# result of this recipe and nothing else, and the run FAILS if the tracked file is
# not byte-identical to what this recipe renders. No push and no pull request can
# ever write that file -- such a run fails and tells the human to start this workflow
# again with commit=true, which is the one path on which CI commits its own render.
# The producer is this recipe, running here.
#
# A COROLLARY THAT SURPRISES PEOPLE
# The tracked PDF cannot be produced on a workstation. The same source at the same
# SOURCE_DATE_EPOCH renders to the same 19 sheets and the same layout elsewhere, but
# not to the same bytes -- font subsetting and image encoding follow the OS's font
# stack and libraries, which is why runs-on is pinned below. So "re-render it and
# commit" is not the fix for a byte-equality failure; running this workflow with
# commit=true is.
#
# THE CHECKS ARE AGAINST THE SOURCE, NOT AGAINST CONSTANTS
# The old "24 pages / A4 landscape" assertions both passed on a document whose every
# page had reflowed, so a green run proved nothing. render-studio-pdf.js instead
# requires every sheet's MediaBox to equal the size the studio document's own @page
# rule declares, resolved by the same CSS engine that sized the sheets. That check
# cannot survive the studio's trim changing underneath it.
#
# Determinism: fonts come from db-render/vendor so an upstream font revision cannot
# move the layout, and the renderer rewrites the PDF's /CreationDate and /ModDate
# from SOURCE_DATE_EPOCH — Chromium stamps wall-clock time and ignores that variable
# on its own, which is why two runs used to differ in exactly two bytes. The
# render-twice step below enforces the result on every run.
#
# Gitea Actions also reads .github/workflows, so this file works on either.
name: render-print-pdf

on:
  push:
    branches: [main]
    paths:
      - 'db.js'
      - 'magazine.model.json'
      - 'assets/**'
      - 'db-render/render-studio-pdf.js'
      # pdf-dates.js pins /CreationDate and /ModDate, which is the exact mechanism
      # the byte-equality guard below depends on: edit it and the tracked PDF's
      # bytes change. It is as much an input as the renderer itself.
      - 'db-render/pdf-dates.js'
      - 'db-render/check-safe-area.js'
      - 'db-render/vendor/**'
      # The tracked artifact is guarded below, so a change to IT must run this too.
      # Without this line the workflow that renders the PDF did not trigger on the
      # pull request that changed the PDF (#43), which is half of how it went stale.
      - 'db-render/out/**'
      - '.github/workflows/render-print-pdf.yml'
  pull_request:
    paths:
      - 'db.js'
      - 'magazine.model.json'
      - 'assets/**'
      - 'db-render/render-studio-pdf.js'
      # pdf-dates.js pins /CreationDate and /ModDate, which is the exact mechanism
      # the byte-equality guard below depends on: edit it and the tracked PDF's
      # bytes change. It is as much an input as the renderer itself.
      - 'db-render/pdf-dates.js'
      - 'db-render/check-safe-area.js'
      - 'db-render/vendor/**'
      # The tracked artifact is guarded below, so a change to IT must run this too.
      # Without this line the workflow that renders the PDF did not trigger on the
      # pull request that changed the PDF (#43), which is half of how it went stale.
      - 'db-render/out/**'
      - '.github/workflows/render-print-pdf.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the re-rendered PDF over the committed one — the supported way to clear a byte-equality failure'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render-print-pdf-${{ github.ref }}
  cancel-in-progress: true

env:
  PDF: out/Daily Bread №1 — print.pdf
  MANIFEST: out/magazine-render.json

jobs:
  render:
    # PINNED, not ubuntu-latest. The rendered bytes depend on this image's font stack
    # and libraries, so a floating label would move the artifact underneath the
    # byte-equality guard below and redden runs that changed nothing. This narrows
    # that window rather than closing it: ubuntu-24.04 is itself refreshed, and a
    # font or library change inside it can still move the bytes. When that happens
    # the guard fails on a change that touched nothing, and the fix is a commit=true
    # run -- loud and safe, which is the trade being made here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        working-directory: db-render
        run: |
          npm install playwright@1.61.0 --no-save
          npx playwright install --with-deps chromium

      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # The renderer applies this to the PDF's own date strings, which is what lets
      # the render-twice check below compare whole files instead of page counts.
      - name: Pin SOURCE_DATE_EPOCH to the commit date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      # Renders DB.render(model) — the studio's document — and fails unless every
      # sheet matches the trim + bleed + slug that document declares.
      - name: Render the magazine PDF from the studio document
        working-directory: db-render
        run: node render-studio-pdf.js "$PDF"

      - name: Report what came out
        working-directory: db-render
        run: |
          pdfinfo "$PDF" | grep -E "Pages|Page size|File size"
          pages=$(pdfinfo "$PDF" | awk '/^Pages:/{print $2}')
          [ "${pages:-0}" -ge 1 ] || { echo "::error::the render produced no pages"; exit 1; }

      # The safe area is the check that catches what nothing else here can see. The
      # media box is the whole sheet so backgrounds bleed, which means the safe inset
      # lives in the flow — and a section that outgrows its page fragments onto a
      # sheet that starts its first line outside the trim. The render still succeeds,
      # the page count still looks plausible, and the studio preview has no sheets in
      # it at all. Geometry comes from the document's own printGeom, not a constant.
      - name: Check the safe area on every sheet
        working-directory: db-render
        run: node check-safe-area.js "$PDF"

      # A claim of determinism that wasn't tested twice is not evidence.
      - name: Render a second time and require byte-identical output
        working-directory: db-render
        run: |
          # Into its own directory, deliberately. The renderer writes its manifest to
          # dirname(OUT)/magazine-render.json, so rendering to out/second.pdf would
          # overwrite out/magazine-render.json -- the file this workflow goes on to
          # upload and, on the opt-in path, COMMIT. That was survivable only because
          # the two renders are identical, which is the very thing being tested here.
          mkdir -p out/second
          node render-studio-pdf.js "out/second/second.pdf" >/dev/null
          if cmp -s "$PDF" "out/second/second.pdf"; then
            echo "deterministic: two renders are byte-identical ($(sha256sum "$PDF" | cut -c1-16))"
          else
            echo "::error::render is NOT deterministic — two runs of the same source differ"
            cmp -l "$PDF" "out/second/second.pdf" | head -20
            ls -l "$PDF" "out/second/second.pdf"
            exit 1
          fi
          rm -rf out/second

      # Uploaded BEFORE the guards below, deliberately. When the byte-equality gate
      # fails it tells a human to re-render; they need this recipe's own output in
      # hand to diff against the tracked file, and a step after a failing one never
      # runs.
      - name: Upload the rendered PDF
        uses: actions/upload-artifact@v4
        with:
          name: print-pdf
          path: |
            db-render/out/Daily Bread №1 — print.pdf
            db-render/out/magazine-render.json
          if-no-files-found: error
          retention-days: 30

      # ---- THE TRACKED ARTIFACT MUST BE THIS RECIPE'S OUTPUT ----------------
      # Read the committed copies out of the tree: the working copy has already been
      # overwritten by the render above. These three steps are skipped only on the
      # deliberate opt-in re-commit, which exists precisely to replace the artifact.
      - name: Read the committed artifact
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.commit) }}
        run: |
          git show "HEAD:db-render/$PDF" > /tmp/committed.pdf 2>/dev/null \
            || { echo "::error::no PDF is committed at db-render/$PDF — the tracked file is what ships"; exit 1; }
          git show "HEAD:db-render/$MANIFEST" > /tmp/committed.json 2>/dev/null \
            || { echo "::error::db-render/$MANIFEST is not committed; it records the epoch its PDF was rendered at"; exit 1; }

      # Prepress stated in its own terms. Byte equality below subsumes this whenever
      # it passes, but this names the defect a human has to act on ("type outside the
      # safe area, cut off the finished copy") instead of leaving them to infer it
      # from a byte mismatch. It needs no browser: node, poppler and db.js only.
      - name: The committed PDF must pass the safe-area guard
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.commit) }}
        working-directory: db-render
        run: node check-safe-area.js /tmp/committed.pdf

      # THE GUARD. Anything stale, hand-rendered, or edited outside CI fails here.
      #
      # WHY IT RENDERS AGAIN INSTEAD OF REUSING THE RENDER ABOVE
      # The renderer pins the PDF's /CreationDate and /ModDate from SOURCE_DATE_EPOCH,
      # and this workflow sets that to the HEAD commit date. Every commit therefore
      # moves those bytes, so comparing the tracked file against a render at HEAD's
      # date would be red on every commit after the one that produced it -- and a
      # guard that is always red is one people learn to re-run rather than read. The
      # manifest records the epoch its own PDF was rendered at, so the comparison
      # renders at THAT epoch. Only the date strings depend on it, never the layout.
      #
      # WHY NOT modelHash, WHICH WOULD BE CHEAPER
      # The exact drift this guard exists for left modelHash completely unchanged at
      # 5a715b94cf6f: the model was identical and db.js's print stylesheet had moved
      # underneath it, 33 sheets to 19. A modelHash comparison would have passed.
      - name: The committed PDF must be byte-identical to this render
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.commit) }}
        working-directory: db-render
        run: |
          epoch=$(node -e 'const m=require("/tmp/committed.json"); if(!m.sourceDateEpoch) process.exit(1); process.stdout.write(String(m.sourceDateEpoch))') \
            || { echo "::error::the committed manifest records no sourceDateEpoch, so its PDF cannot be reproduced"; exit 1; }
          echo "the committed manifest says it was rendered at SOURCE_DATE_EPOCH=$epoch"
          mkdir -p out/cmp
          SOURCE_DATE_EPOCH="$epoch" node render-studio-pdf.js "out/cmp/against-committed.pdf" >/dev/null
          rc=0
          cmp -s "out/cmp/against-committed.pdf" /tmp/committed.pdf || rc=1
          # The manifest is committed alongside the PDF and the epoch above is READ
          # from it, so leaving it unchecked would let a wrong manifest be reported as
          # a stale PDF. Every field in it derives from the same source and the same
          # epoch, so the recipe reproduces it byte-for-byte too.
          cmp -s "out/cmp/magazine-render.json" /tmp/committed.json || rc=1
          if [ "$rc" = 0 ]; then
            echo "the committed PDF and manifest are exactly what this recipe renders ($(sha256sum /tmp/committed.pdf | cut -c1-16))"
          else
            echo "::error::the committed artifact is NOT what this recipe renders — it is stale, or it was produced outside CI"
            echo "committed   sha256 $(sha256sum /tmp/committed.pdf | cut -d' ' -f1)  pages $(pdfinfo /tmp/committed.pdf | awk '/^Pages:/{print $2}')  $(stat -c%s /tmp/committed.pdf) bytes"
            echo "this recipe sha256 $(sha256sum "out/cmp/against-committed.pdf" | cut -d' ' -f1)  pages $(pdfinfo "out/cmp/against-committed.pdf" | awk '/^Pages:/{print $2}')  $(stat -c%s "out/cmp/against-committed.pdf") bytes"
            diff -u /tmp/committed.json "out/cmp/magazine-render.json" || true
            cmp -l "out/cmp/against-committed.pdf" /tmp/committed.pdf | head -10 || true
            echo "Do NOT re-render this locally and commit it: a workstation render"
            echo "differs from this runner's in font and image encoding (same layout,"
            echo "same page count, different bytes), so a hand-made file can never"
            echo "satisfy this guard. Update it the only supported way:"
            echo "  Actions -> render-print-pdf -> Run workflow -> commit = true"
            echo "That makes CI render the artifact and commit its own output."
          fi
          rm -rf out/cmp
          [ "$rc" = 0 ] || exit 1

      - name: Summarise the render on the run page
        if: ${{ always() }}
        working-directory: db-render
        run: |
          # This runs even when a guard above failed, so the run page still says what
          # came out. It must not invent a second failure when there is nothing to
          # report: if an earlier step died before the render, the file is absent.
          if [ ! -f "$PDF" ]; then
            echo "No PDF was rendered in this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Magazine PDF — rendered from the studio document"
            echo
            echo "Source: \`DB.render(model)\` via \`db-render/render-studio-pdf.js\` (the same HTML the studio previews)."
            echo
            echo '```'
            pdfinfo "$PDF" | grep -E "Pages|Page size|File size"
            echo "sha256 $(sha256sum "$PDF" | cut -d' ' -f1)"
            echo '```'
            echo
            echo "Model fingerprint and per-render detail:"
            echo
            echo '```json'
            cat "$MANIFEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Opt-in only. Never runs on push or pull_request.
      - name: Commit the rendered PDF (explicit opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.commit
        run: |
          git config user.name "db-render-bot"
          git config user.email "db-render-bot@users.noreply.github.com"
          git add -f "db-render/$PDF" "db-render/$MANIFEST"
          if git diff --cached --quiet; then
            echo "no change in the rendered PDF"
            exit 0
          fi
          # No [skip ci], but do not expect it to verify itself: a push made with the
          # checkout-persisted GITHUB_TOKEN does not start a normal workflow run
          # (GitHub suppresses that to prevent loops), so the runs this commit
          # appears to queue sit at action_required and never execute. To SEE the
          # guard pass on the artifact just committed, run this workflow again with
          # commit=false. Looping is impossible regardless: committing requires
          # workflow_dispatch with commit=true, which no trigger can set.
          git commit -m "ci: re-render the magazine PDF from the studio document (manual opt-in)"
          git push

      # always(): this is the step that tells a human what to do about a FAILED
      # byte-equality guard, so it is worthless if the failure skips it.
      - name: Note that nothing was committed
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.commit) }}
        run: |
          echo "The committed PDF was left untouched — no push or pull request ever writes it. It is downloadable as the \`print-pdf\` artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "If the byte-equality guard failed, run this workflow from the Actions tab with **commit = true**. Do not render it locally — a workstation render is byte-different from this runner's and can never satisfy the guard." >> "$GITHUB_STEP_SUMMARY"
