# Three checks that would each have caught a bug this repo actually shipped.
#
# 1. GENERATED FILES MUST MATCH THEIR GENERATOR
# Every page in the site root is output from tools/build.js. That makes a merge
# conflict in a generated file resolvable in a way that is syntactically clean and
# semantically wrong, and nothing reports it. This happened: PR #38 translated the
# six verify.* keys, the merge in 6928104 resolved the fifteen translated editions
# to their PRE-translation bytes, and the result shipped. Readers of every
# non-English edition were shown the verification failure banner in English for a
# month. The i18n coverage line did not catch it because it reads the SOURCES,
# which were correct all along; only the built pages were stale.
# The check is simply: rebuild, and require the tree to be unchanged.
#
# 2. THE LIVE SITE MUST STILL HASH TO WHAT WAS SIGNED
# `dbproof status` verifies the log against itself and never re-hashes anything, so
# it reads perfectly healthy while every reader sees "This edition could not be
# verified". That is exactly what happened: the proofs went stale 59 minutes after
# they were signed and nobody noticed for a month. check_live.py makes the same
# comparison the reader's badge makes, against the deployed site.
#
# It distinguishes the two failure modes, because they want different responses:
# a STALE PROOF (served == repo, but neither matches the signature) is publishing
# hygiene and only the off-box publisher key can clear it; SERVED DIFFERS
# (served != repo) is a bad deploy, a poisoned cache, an edge rewriting the page,
# or tampering -- the case the transparency log exists for.
#
# Note for whoever reads a red scheduled run: the live job compares the tip of main
# to the deployed site, so a run that fires during a deploy can report SERVED
# DIFFERS for a minute. Re-run it before treating that as an incident.
#
# 3. THE BUILT SITE MUST STILL READ BACK CLEAN
# tools/check-site.js reads the 48 built pages the way a browser and a crawler do
# -- links, anchors, ids, alt text, hreflang, canonicals, the sitemap, and <nav>
# naming. It existed but nothing ran it, so it drifted to 145 problems unnoticed:
# every edition shipped two <nav> landmarks both named "Sections", which leaves a
# screen-reader user unable to tell the header nav from the contents rail. A check
# nobody runs is not a check, which is why this job exists.
#
# Gitea Actions also reads .github/workflows, so this file works on either.
name: verify-editions

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily. The failure this catches is silent and open-ended -- the last one ran
    # for a month -- so the cadence matters more than the hour.
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-editions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: generated files match tools/build.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # build.js uses only the node standard library, so there is nothing to install.
      - name: Rebuild the site
        run: node tools/build.js

      - name: Require the rebuild to change nothing
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            echo "::error::Committed generated files do not match tools/build.js output."
            echo
            echo "Someone edited a generated page by hand, or a merge resolved one to"
            echo "stale bytes. Do not hand-fix the pages: run 'node tools/build.js' and"
            echo "commit the result."
            echo
            git status --porcelain
            echo
            git --no-pager diff --stat
            exit 1
          fi
          echo "Clean: every generated file matches its generator."

  site:
    name: built pages read back clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deliberately checks the COMMITTED pages, not a fresh build: those are the
      # bytes that deploy. The `generated` job above is what proves they match
      # tools/build.js, so the two jobs together cover both halves.
      # check-site.js has no dependencies on purpose, same rule as build.js.
      - name: Read the built site back
        run: node tools/check-site.js

  # 4. THE .tex MUST STILL PRODUCE THE COMMITTED WEB INPUT
  # content/issue-01.tex is the source of truth; content/issue-01.js is emitted
  # from it and is what tools/build.js reads. Parse the .tex, require it to equal
  # the committed .js, rebuild the site, require the tree unchanged, and verify
  # the newsproof proofs offline. Runs on pull requests on purpose: the `live`
  # job below cannot (it needs production), which is how a one-string change
  # once reached main with 15 of 16 editions unverifiable.
  latex:
    name: the .tex round-trips to the web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Standard library only: python3 for the parser, node for build.js.
      - name: Parse the .tex, rebuild the site, verify the proofs
        run: |
          python3 tools/db-latex.py check --edition issue-01 --web
          python3 tools/db-latex.py check --edition issue-02 --web

  # 5. THE .tex MUST STILL TYPESET TO THE PRESS GEOMETRY
  # 48 A5 pages (420 x 594.96 pt) and 24 A4-landscape sides (841.92 x 594.96 pt),
  # the sizes db-render/out/*.pdf measure. Needs TeX, so it runs in the TeX Live
  # image on the self-hosted runners only (2.7 GB, pulled once there; never on
  # github.com). Without riposte-latex on the runner the class uses its shim,
  # which changes the face and colours but not the geometry this job asserts.
  latex-print:
    name: the .tex typesets to the press geometry
    if: ${{ !contains(github.server_url, 'github.com') }}
    runs-on: ubuntu-latest
    container: texlive/texlive:latest-full
    steps:
      # FIRST, before checkout: a TeX image has no node and every `uses:` step
      # is a JS action. pdfinfo is what check --print measures the PDFs with.
      - name: Install node, python and poppler
        run: apt-get update -qq && apt-get install -y -qq nodejs python3 poppler-utils

      - uses: actions/checkout@v4

      - name: Typeset both print outputs and measure them
        run: |
          python3 tools/db-latex.py check --edition issue-01 --print
          python3 tools/db-latex.py check --edition issue-02 --print

      - name: Keep the PDFs
        if: always()
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: daily-bread-print
          path: |
            build/latex/issue-01/print.pdf
            build/latex/issue-01/booklet.pdf
            build/latex/issue-02/print.pdf
            build/latex/issue-02/booklet.pdf

  live:
    name: live editions still hash to their signatures
    # A PR from a fork cannot tell us anything about production, and the scheduled
    # run is the one that matters. Skip it on pull_request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # check_live.py is standard library only, same rule as verify_standalone.py.
      - name: Check the deployed editions against the published proofs
        working-directory: tools
        run: python3 -m newsproof.check_live
