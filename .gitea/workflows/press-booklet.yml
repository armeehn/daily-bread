# Makes the press booklet the studio offers when no press is running, proves
# the press deterministic, and keeps the tracked copy honest.
#
# WHAT SHIPS
# press/<edition>/booklet.pdf is the press's own output (tools/press/render.js):
# DB.render(model) — the page the website shows — laid out on A5 sheets by
# db-print.js in headless Chromium (exactly the studio's Web PDF), imposed two
# to a Letter-landscape side in saddle-stitch order by pdf-lib. booklet.json
# beside it names the edition (and the hash of its model), the geometry and the
# bytes; limits.json is each writer's word limit on those pages, which the
# submissions desk (desk/) bundles.
#
# One renderer: the website, the Web PDF and every printed PDF are the same
# pages in the same fonts (assets/fonts/). The LaTeX press this job used to run
# is retired.
#
# THE GUARD
# The tracked files must describe the edition as it is now: same model hash,
# same pages, same trim. A change to db.js's default edition, the renderer or
# the pager that moves the booklet makes this red until the booklet is
# re-rendered — here, with workflow_dispatch commit=true, or locally with
# `node tools/press/render.js --publish` (fonts are self-hosted and the
# Chromium is pinned, so a workstation renders the same pages; the bytes may
# differ by the Chromium build, which is why bytes are compared only within a run).
name: press-booklet

on:
  push:
    branches: [main]
    paths:
      - 'db.js'
      - 'db-print.js'
      - 'assets/fonts/**'
      - 'tools/press/**'
      - 'tools/wireframe/**'
      - 'press/**'
      - '.gitea/workflows/press-booklet.yml'
  pull_request:
    paths:
      - 'db.js'
      - 'db-print.js'
      - 'assets/fonts/**'
      - 'tools/press/**'
      - 'tools/wireframe/**'
      - 'press/**'
      - '.gitea/workflows/press-booklet.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the re-rendered booklet over the tracked one'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: press-booklet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  press:
    runs-on: ubuntu-latest
    # the browsers and their system libraries, at the version tools/press pins
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      SOURCE_DATE_EPOCH: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Install the press
        working-directory: tools/press
        run: npm ci --no-audit --no-fund

      # the Web PDF and the press lay out the same sheets; the products are well formed
      - name: Test the press
        working-directory: tools/press
        run: npm test

      - name: Keep the tracked manifest aside
        run: cp press/issue-01/booklet.json /tmp/tracked-booklet.json

      - name: Render the booklet and the word limits
        run: node tools/press/render.js --publish

      # A claim of determinism that wasn't tested twice is not evidence.
      - name: Render a second time and require byte-identical output
        run: |
          cp -r press /tmp/first
          node tools/press/render.js --publish >/dev/null
          if diff -r /tmp/first press >/dev/null; then
            echo "deterministic: two renders are byte-identical"
          else
            echo "::error::the press is NOT deterministic — two renders of the same edition differ"
            diff -r /tmp/first press | head -20
            exit 1
          fi

      # the DTP wireframe (wireframe/README.md): measure the same layout and
      # write a well-formed IDML; Scribus for the .sla is not in this image
      - name: Build and check the IDML wireframe
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3 >/dev/null; }
          node tools/wireframe/extract.js --out /tmp/wireframe/spec.json
          python3 tools/wireframe/build_idml.py /tmp/wireframe/spec.json /tmp/wireframe/issue.idml
          python3 tools/wireframe/check_idml.py /tmp/wireframe/issue.idml

      - name: Upload the booklet
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: press-booklet
          path: press/
          if-no-files-found: error
          retention-days: 30

      - name: The tracked booklet must be this edition's
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.commit) }}
        run: |
          node -e '
            const a = require("/tmp/tracked-booklet.json"), b = require("./press/issue-01/booklet.json");
            const keys = ["edition", "modelSha256", "pages", "sides", "pageWidthPt", "pageHeightPt"];
            const bad = keys.filter(k => JSON.stringify(a[k]) !== JSON.stringify(b[k]));
            if (bad.length) {
              for (const k of bad) console.log(`::error::${k}: tracked ${JSON.stringify(a[k])}, rendered ${JSON.stringify(b[k])}`);
              console.log("Re-render it: node tools/press/render.js --publish, or run this workflow with commit = true.");
              process.exit(1);
            }
            console.log("the tracked booklet is this edition: " + keys.map(k => k + "=" + JSON.stringify(b[k])).join(" "));'

      - name: Summarise the press on the run page
        if: ${{ always() }}
        run: |
          {
            echo "### Press booklet — DB.render + db-print.js"
            echo
            echo '```'
            cat press/issue-01/booklet.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Opt-in only. Never runs on push or pull_request.
      - name: Commit the rendered booklet (explicit opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit }}
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "Sasha Zero"
          git config user.email "sasha@ripostelabs.xyz"
          git add press
          if git diff --cached --quiet; then
            echo "no change in the booklet"
            exit 0
          fi
          git commit -m "ci: re-render the press booklet (manual opt-in)"
          git push
